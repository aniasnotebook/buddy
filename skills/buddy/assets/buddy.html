<title>Buddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Buddy, look C. Phone: one column, the stage on top, the button at the bottom. From 900px: courses in a sidebar, the stage on the left, her move on the right.
   Deliberately one light look (plain white), as agreed. */
:root{
  --white:#ffffff; --ink:#111111; --muted:#737373; --rim:#e6e6e6; --mist:#f5f5f5;
  --pink:#f06a98; --pink-tint:#fde3ec; --green:#7fee64; --green-ink:#2f6b1f; --orange:#ff7a45; --orange-tint:#fff1ea; --red:#e5383b; --red-tint:#fdecec;
  --disp:'Titan One','Arial Black',sans-serif; --body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --press:0 4px 0 rgba(0,0,0,.2); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--white);color:var(--ink);font:16px/1.5 var(--body);letter-spacing:-.01em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:1320px;margin:0 auto;padding-block:16px 120px;min-height:100%}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:400;line-height:1.05;text-wrap:balance;letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
/* brand: logo A1, the two d's on cards */
.word{display:inline-flex;align-items:flex-end;white-space:nowrap;font-family:var(--disp);line-height:1}
.word .dc{display:inline-flex;align-items:center;justify-content:center;width:.62em;height:.98em;border-radius:.14em;margin:0 -.02em;vertical-align:-.12em}
.word .dc span{font-size:.82em;line-height:1}
.dc.p{background:var(--pink);color:var(--ink);transform:rotate(-8deg)} .dc.k{background:var(--ink);color:var(--white);transform:rotate(7deg)}
/* buttons */
/* Buttons. L (52px): the one main action of a screen, full width. S (40px): an action inside a list or a bar. XS (34px): an action on one row (Retirer, Ajouter).
   Pink = the main action; ink = go on in a game; white = secondary; red = only the final "delete" of a confirmation. Icons: one stroke set, 18px, 8px from the text. */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;line-height:1.2;text-align:center;background:var(--pink);color:var(--ink);box-shadow:var(--press);font-weight:600;font-size:16px;padding:0 20px;width:100%;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ink{background:var(--ink);color:var(--white)}
.btn.white{background:var(--white);border:2px solid var(--rim);box-shadow:0 4px 0 var(--rim)}
.btn:disabled{background:var(--rim);color:#8a8a8a;box-shadow:0 4px 0 #d6d6d6;cursor:default;transform:none}
.btn.sm{min-height:40px;width:auto;font-size:14px;border-radius:12px;padding:0 14px;gap:6px}
.btn.xs{min-height:34px;width:auto;font-size:13px;border-radius:10px;padding:0 12px;gap:6px;box-shadow:none;border:1.5px solid var(--rim);background:var(--white);flex:none}
.btn.xs:active{transform:none;background:var(--mist)}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 4px 0 #a4161a}
.btn svg,.icon svg,.act svg,.back svg,.rowbtn svg{width:18px;height:18px;flex:none}
.icon svg,.btn.only svg{width:20px;height:20px}.btn.only{width:44px;min-height:44px;padding:0;flex:none}
.side .foot svg,.list svg,.add svg{width:18px;height:18px;flex:none}
.pin{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));margin:0 -4px;padding:10px 4px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--white) 80%,rgba(255,255,255,0));z-index:2}
.rows{display:flex;flex-direction:column;border:1px solid var(--rim);border-radius:18px;overflow:hidden}
.rowbtn{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid var(--rim);font-weight:600;text-align:left;width:100%}
.rowbtn:last-child{border-bottom:0}.rowbtn:hover{background:var(--mist)}
.rowbtn .grow{flex:1}.rowbtn .muted{font-weight:500}
.rowbtn.red{color:#a4161a}
.sheethead{display:flex;align-items:center;gap:8px;min-height:44px}.sheethead h2{flex:1;font-size:24px}
.sheethead .back{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 2px;border-radius:12px;font-weight:600;color:var(--muted)}
.link{font-weight:600;text-decoration:underline;color:var(--muted);min-height:40px;display:inline-flex;align-items:center}
.icon{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.icon:hover{background:var(--mist)}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:99px;background:var(--mist);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input,textarea{font:inherit;color:var(--ink);background:var(--white);border:2px solid var(--rim);border-radius:14px;min-height:50px;padding:10px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.card{background:var(--white);border:1px solid var(--rim);border-radius:24px;padding:22px}
.dot{display:inline-block;width:10px;height:10px;border-radius:99px;flex:none}
.dot.ok{background:var(--green)} .dot.no{background:var(--red)} .dot.part{background:var(--orange)}
.quote{padding:10px 12px;border-radius:12px;background:var(--mist);font:13px/1.5 var(--mono)}
/* layout: courses sidebar on computers */
.shell{display:block}
.side{display:none}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;align-items:start}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;min-height:calc(100vh - 32px);background:var(--mist);border-radius:24px;padding:16px 14px}
}
.side .c{display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px 10px;font-weight:600;text-align:left;width:100%;min-height:52px;position:relative}
.side .c:hover{background:rgba(0,0,0,.04)}
.side .c .ini{width:34px;height:34px;border-radius:10px;background:var(--white);border:1px solid var(--rim);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;flex:none}
.side .c .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .c[aria-current="true"]{background:var(--white);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.side .c[aria-current="true"]::before{content:'';position:absolute;left:-6px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--pink)}
.side .c[aria-current="true"] .ini{background:var(--ink);color:var(--pink);border-color:var(--ink)}
.side .home{display:flex;align-items:center;min-height:48px;padding:0 6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--rim)}
.side .foot button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left}
.side .foot button:hover{background:rgba(0,0,0,.04);color:var(--ink)}
/* top bar: what screen this is, how to go back, the settings */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;min-height:60px;margin:-16px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 4px;padding:8px max(12px, env(safe-area-inset-left, 0px));background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--rim)}
.topbar .back{display:flex;align-items:center;gap:4px;min-height:40px;padding:0 10px 0 4px;border-radius:12px;font-weight:600;font-size:14px}
.topbar .back:hover{background:var(--mist)}

.topbar .ttl{flex:1;min-width:0;text-align:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .act{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--mist);font-weight:600;font-size:14px}
.topbar .sp{width:88px;flex:none}
@media (min-width:900px){.topbar{position:static;margin:0 0 4px;padding:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;min-height:48px}.topbar .back,.topbar .ttl{display:none}.topbar{justify-content:flex-end}.topbar .sp{display:none}}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
/* lists */
.list{display:flex;flex-direction:column;border:1px solid var(--rim);border-radius:20px;overflow:hidden}
.list>*{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--rim);text-align:left;width:100%;min-height:56px}
.list>*:last-child{border-bottom:0}
.courses{display:flex;flex-direction:column;gap:10px}
.course{display:flex;align-items:center;gap:14px;border:1px solid var(--rim);border-radius:20px;padding:16px;text-align:left;width:100%;min-height:76px}
.course .ini{width:44px;height:44px;border-radius:12px;background:var(--mist);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:20px;flex:none}
.course .meta{flex:1;min-width:0}
.course b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add svg{width:18px;height:18px}.add{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:20px;border:2px dashed var(--rim);color:var(--muted);font-weight:600;width:100%}
.day{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.day .deco{position:absolute;right:-24px;top:-24px;width:110px;height:110px;border-radius:28px;background:var(--pink);transform:rotate(14deg)}
.day h2{font-size:48px}
.top2{display:grid;gap:18px}
@media (min-width:900px){.top2{grid-template-columns:1.2fr 1fr;align-items:start}}
.game{display:flex;align-items:center;gap:12px;border:1px solid var(--rim);border-radius:18px;padding:12px 14px}
.game .sc{width:40px;height:52px;border-radius:10px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;transform:rotate(-5deg);flex:none;font-family:var(--disp);font-size:20px;color:var(--pink)}
.game .tx{flex:1;min-width:0;text-align:left}
.uprow{display:grid;grid-template-columns:1fr;gap:8px}
.banner{display:flex;align-items:center;gap:10px;border-radius:16px;background:var(--ink);color:var(--white);padding:12px 14px;font-size:14px}
/* files */
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--rim);border-radius:14px;padding:10px 12px}
.file.bad{border-color:var(--orange);background:var(--orange-tint)}
.file .kind{width:58px;flex:none;font:500 11px/1.3 var(--mono);text-transform:uppercase}
.file .nm{flex:1;min-width:0;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;display:flex;align-items:flex-end;justify-content:center}.scrim.enter{animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--white);border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}.enter .sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet.chat{height:92vh;max-height:92vh;overflow:hidden}.sheet.chat .msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:28px;max-height:80vh}.scrim.drawer{justify-content:flex-end;align-items:stretch}.sheet.chat{max-width:520px;height:100vh;max-height:100vh;border-radius:28px 0 0 28px}.enter .sheet.chat{animation:side .24s cubic-bezier(.2,.8,.2,1)}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--rim);align-self:center}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5}.msg.me{white-space:pre-wrap}.msg p{margin:0 0 8px}.msg p:last-child{margin:0}.msg h4{font:600 16px/1.3 var(--body);margin:10px 0 4px}.msg ul{margin:4px 0 8px;padding-left:18px}.msg li{margin:2px 0}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:9px;background:#a3a3a3;animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--white);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--mist);border-bottom-left-radius:6px}
/* the game */
.g{display:flex;flex-direction:column;gap:16px;padding-bottom:110px}
.gtop{display:flex;align-items:center;gap:14px}
.segs{flex:1;display:flex;gap:4px} .segs i{flex:1;height:5px;border-radius:3px;background:var(--rim);transition:background .3s} .segs i.on{background:var(--pink)}
.stage{background:var(--ink);color:var(--white);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}.stage.enter{animation:in .28s cubic-bezier(.2,.8,.2,1)}
.stage .label{color:#a3a3a3}
.stage .sit{color:#d4d4d4;font-size:16px;line-height:1.45}.stage .prev{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#a3a3a3;border-left:2px solid #333;padding-left:10px}.stage .prev b{color:#fff;font-weight:600}
.stage .q{font-family:var(--body);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.move{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;border-radius:16px;background:var(--white);border:2px solid var(--rim);border-bottom-width:4px;padding:10px 16px;font-weight:600;font-size:17px;text-align:left;width:100%;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.sel{background:var(--pink-tint);border-color:var(--pink)}
.opt.good{border-color:var(--ink)} .opt.bad{background:var(--red-tint);border-color:var(--red)} .opt.fade{opacity:.35}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{display:inline-flex;align-items:center;min-height:44px;border-radius:14px;background:var(--white);border:2px solid var(--rim);border-bottom-width:4px;padding:8px 12px;font-weight:600;font-size:15px;text-align:left}
.pc.on{border-color:var(--ink)} .pc.good{background:#f0fde9;border-color:#2f8a4a} .pc.bad{background:var(--red-tint);border-color:var(--red)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.answer{min-height:70px;border-radius:16px;border:2px dashed var(--rim);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.answer:empty::before{content:attr(data-empty);color:var(--muted);font-size:14px;padding:8px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px}
.slot .n{width:18px;font:500 11px var(--mono);color:var(--muted)}
.slot .e{flex:1;min-height:44px;border-radius:14px;background:var(--mist);border:2px dashed var(--rim)}
.line{display:flex;gap:8px;padding:12px 14px;border-radius:14px;background:var(--mist);border:2px solid transparent;font-size:16px;text-align:left;width:100%}
.line.sel{background:var(--pink-tint);border-color:var(--pink)} .line.good{background:#f0fde9;border-color:#2f8a4a} .line.bad{background:var(--red-tint);border-color:var(--red)}
.flash{perspective:1200px;display:flex;justify-content:center}
.flash button{width:min(320px,100%);height:380px;border-radius:28px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .45s}
.flash .front{background:var(--ink);color:var(--white)} .flash .back{background:var(--white);border:2px solid var(--ink);border-bottom-width:5px}
.flash .front h3{font-size:34px}
.timer{height:6px;border-radius:3px;background:#333;overflow:hidden} .timer i{display:block;height:100%;background:var(--pink);transition:width 1s linear}
.done-tags{display:flex;gap:6px;flex-wrap:wrap}
.done-tags span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:#f0fde9;color:var(--green-ink)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--white) 70%,rgba(255,255,255,0))}
.dock>div{max-width:560px;margin:0 auto}
.verdict{border-radius:26px;border:1px solid var(--rim);background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:20px;display:flex;flex-direction:column;gap:10px}.verdict.enter{animation:up .26s cubic-bezier(.2,.8,.2,1)}
.verdict .w{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:26px}
.keys{display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (min-width:900px){
  .g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:28px 40px;align-items:center;padding-bottom:24px;min-height:calc(100vh - 40px)}
  .g .gtop{grid-column:1 / -1;align-self:start}
  .g .stage{align-self:stretch;min-height:440px;justify-content:center;padding:40px}
  .g .stage .q{font-size:36px}
  .g .move{gap:12px}
  .g .opt{min-height:68px;font-size:19px}
  .dock{position:static;padding:0;background:none;margin-top:8px}
  .dock>div{max-width:none}
}
/* making / loaders, from logo A1 */
.making{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.pair{display:flex;gap:6px}
.pair .dc{font-size:96px}
.deck{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:420px}.deck i{width:46px;height:62px;border-radius:10px;border:2px dashed var(--rim);transition:transform .35s cubic-bezier(.2,1.4,.4,1),background .2s,border-color .2s}.deck i.on{border:0;transform:rotate(-6deg) translateY(-4px)}.deck i.on:nth-child(odd){background:var(--pink)}.deck i.on:nth-child(even){background:var(--ink);transform:rotate(6deg) translateY(-4px)}.deck i.ok{box-shadow:inset 0 0 0 3px var(--green)}
.bar{height:6px;border-radius:3px;background:var(--mist);overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}
.shuf{position:relative;width:150px;height:100px} .shuf .dc{position:absolute;top:0;font-size:90px} .shuf .p{left:10px;animation:bd-sa 1.4s ease-in-out infinite} .shuf .k{left:72px;animation:bd-sb 1.4s ease-in-out infinite}
.steps{display:flex;flex-direction:column;gap:10px;font-weight:600;text-align:left}
.steps div{display:flex;gap:10px;align-items:center;color:#a3a3a3} .steps .on{color:var(--ink)} .steps .ok{color:var(--ink)}
.steps .dot{background:var(--rim)} .steps .on .dot{background:var(--pink)} .steps .ok .dot{background:var(--green)}
.nod{display:inline-flex;gap:4px;margin-left:8px} .nod span{display:inline-flex;width:16px;height:22px;border-radius:5px;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;animation:bd-nod .9s ease-in-out infinite} .nod span:first-child{background:var(--white);color:var(--ink)} .nod span:last-child{background:var(--ink);color:var(--white);animation-delay:.15s}
/* end */
.end{min-height:76vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.medal{width:100px;height:100px;border-radius:28px;background:var(--pink);transform:rotate(-8deg);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:48px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px}

<script>
/* ================= state, kept in this browser ================= */
const KEY = 'buddy-v1';

 {p:1, text:"TD 3 · Le parcours client. Le parcours client se découpe en trois étapes : le pré-achat, l'achat et le post-achat. Le pré-achat regroupe tout ce qui se passe avant la transaction : le client reconnaît un besoin, cherche des informations et compare des offres. L'achat couvre le choix, la commande et le paiement ; c'est en général l'étape la plus courte. Le post-achat commence après la transaction : le client utilise le produit, contacte le service après-vente et donne parfois son avis."},
 {p:2, text:"À chaque étape, le client croise des points de contact. On en distingue quatre types selon qui les contrôle. Les points de contact brand-owned sont conçus et gérés par la marque, comme son site, son appli ou son packaging. Les points de contact partner-owned sont gérés avec des partenaires, comme une agence ou un distributeur. Les points de contact customer-owned dépendent du client seul, comme sa propre réflexion sur ses besoins. Les points de contact social/external échappent à la marque, comme les avis en ligne ou un influenceur indépendant. Au post-achat, un déclencheur mène soit à la fidélité, avec un rachat, soit à un retour au pré-achat où le client compare d'autres offres : c'est la boucle de fidélité."}];
const newCourse = (name, example) => ({id: example ? 'ex' : 'c' + Date.now(), name, example: !!example, created: Date.now(), fresh: true,

const idbGet = async k => { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const idbPut = async (k, v) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };

const chats = {};

const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

const ICONS = {close:'<path d="M6 6l12 12M18 6L6 18"/>', back:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M9 5l7 7-7 7"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>', more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>', plus:'<path d="M12 5v14M5 12h14"/>', up:'<path d="M12 19V5M5 12l7-7 7 7"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/>', play:'<path d="M7 5l12 7-12 7V5z"/>', cards:'<rect x="4" y="6" width="12" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v13"/>', file:'<path d="M14 3H6v18h12V7l-4-4zM14 3v4h4"/>', folder:'<path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6z"/>', drive:'<path d="M8 3h8l6 10-4 7H6l-4-7 6-10zM2 13h20M8 3l8 17M16 3L8 20"/>', help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.5v.01"/>', chat:'<path d="M4 5h16v11H9l-5 4V5z"/>', redo:'<path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5"/>'};
const ic = n => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const word = (size, ink) => `<span class="word" style="font-size:${size}px;color:${ink || 'var(--ink)'}" role="img" aria-label="Buddy">Bu<span class="dc p"><span>d</span></span><span class="dc k"><span>d</span></span>y</span>`;
const pair = cls => `<div class="pair ${cls}" aria-hidden="true"><span class="word" style="font-size:96px"><span class="dc p"><span>d</span></span><span class="dc k"><span>d</span></span></span></div>`;

/* ================= Claude, on her own account ================= */
let sample = null, canImages = false, claudeState = 'wait';
function fromComplete(complete){
  const flat = input => typeof input === 'string' ? input : input.map(t => (t.role === 'user' ? 'Étudiante : ' : 'Buddy : ') + t.content).join('\n\n');
  const f = async (input, o) => { if (o?.images?.length) throw {code:'images_unavailable'}; let text; try { text = await complete(flat(input)); } catch(e){ throw {code:'upstream_error', message:String(e)}; } o?.onText?.({text, delta:text}); return {text, truncated:false}; };
  f.json = async (input, o) => { const {text} = await f(input + '\n\nRéponds uniquement avec le JSON demandé, sans texte autour.', o); const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); const body = m ? m[1] : text.slice(text.search(/[\[{]/), Math.max(text.lastIndexOf('}'), text.lastIndexOf(']')) + 1); try { return JSON.parse(body); } catch(e){ throw {code:'invalid_json', text}; } };
  return f;
}
(async () => {
  try { sample = await window.claude?.use?.('sample'); } catch(e){ sample = null; }
  if (sample) { try { canImages = !!(await sample.limits()).images; } catch(e){ canImages = false; } }
  else if (typeof window.claude?.complete === 'function') sample = fromComplete(window.claude.complete.bind(window.claude));

const ERR = {not_granted:'Tu as refusé l’accès à Claude. Recharge la page pour qu’il te le redemande.', rate_limited:'Ta limite Claude est atteinte pour le moment. Réessaie plus tard.', prompt_too_large:'Ce cours est trop long pour une seule demande : choisis une partie ou retire un fichier.', invalid_json:'La réponse de Claude n’était pas lisible. Réessaie.', sampling_disabled:'Claude n’est pas disponible pour ce compte.', capability_disabled:'Claude n’est pas disponible pour ce compte.', session_expired:'Ta session Claude a expiré. Recharge la page.', refused:'Claude a refusé cette demande. Essaie une autre partie du cours.', empty_completion:'Claude n’a rien renvoyé. Réessaie.', images_unavailable:'Claude ne peut pas lire d’image ici.'};
const errText = e => ERR[e?.code] || ('Claude n’a pas répondu (' + (e?.code || 'erreur') + '). Réessaie.');

/* A course bigger than one Claude request: past exams first, then the pages that match her objective or topic, then the rest, in course order. */
const BUDGET = 110000;
function courseText(c, focus){
  const all = c.files.filter(f => f.pages && f.pages.length).flatMap(f => f.pages.map(pg => ({f, pg, t:`[${f.kind} · ${f.name} · ${f.unit === 'diapo' ? 'diapo' : 'p.'} ${pg.p}]\n${pg.text}`})));
  all.forEach((x, i) => x.i = i);
  if (all.reduce((n, x) => n + x.t.length, 0) <= BUDGET) return all.map(x => x.t).join('\n\n');
  const words = norm(focus || '').split(/[^a-zà-ÿ0-9]+/).filter(w => w.length > 3);
  const score = x => (x.f.kind === 'Annale' ? 1000 : 0) + words.reduce((n, w) => n + (norm(x.pg.text).includes(w) ? 10 : 0), 0) + Math.random();
  const pick = []; let n = 0;
  for (const x of all.slice().sort((a, b) => score(b) - score(a))) { if (n + x.t.length > BUDGET) continue; pick.push(x); n += x.t.length; }
  return '(Extraits : le cours entier est trop long pour une seule demande.)\n\n' + pick.sort((a, b) => a.i - b.i).map(x => x.t).join('\n\n');
}

/* ================= the engine: rules and templates ================= */
const ENGINE = `Tu es le moteur d’exercices Buddy. Tu fabriques un jeu d’entraînement pour une étudiante, à partir de SON cours uniquement (cours, diapos, annales, notes, projets).
Règles d’apprentissage :
- Elle répond avant de voir la réponse. Une seule idée par carte. Questions courtes (20 mots max).
- Mélange les notions. Préfère une situation concrète et nouvelle à une phrase recopiée.
- Pièges plausibles : les vraies confusions, jamais de réponse absurde.
- "why" (une phrase) explique pourquoi LA BONNE RÉPONSE répond exactement à LA QUESTION POSÉE, avec les mots de la question. "trap" (une phrase) explique pourquoi le piège le plus tentant est faux.
- Chaque question se comprend seule : si elle parle d’un montant ou d’une « part », elle dit lequel (ex. « la part du loyer de novembre-décembre, 4 000 € »).
- Si le cours contient des annales [Annale], imite leur style de questions.
- Un tableur (« Feuille … », cellules A1, B2 et formules [=…]) contient souvent des exercices chiffrés : fais-en des "number" ou des "case" en reprenant le raisonnement de ses formules, avec d’autres chiffres.
Tu choisis UNIQUEMENT parmi ces modèles ("type") et tu remplis leurs champs :
- "pick" : situation?, ask, options[4], answer (une des options).
- "case" : situation (2 phrases), steps[2-3] = {ask (se suffit à elle-même), options[3-4], answer, why, trap, quote (la phrase du cours qui justifie CETTE décision)}.
- "sort" : ask, buckets[2-4], items[4-6] = {text, bucket}.
- "order" : ask, items[3-6] dans le bon ordre (seulement si le cours donne un ordre).
- "build" : ask, items[3-4] blocs courts dans l’ordre, traps[2] blocs pièges plausibles.
- "flash" : front (le terme), back (définition + un exemple).
- "mistake" : ask, lines[3-6] (une copie d’étudiant), answer = index (0..) de la seule ligne fausse.
- "number" : situation, ask, numbers {nom: valeur}, formula (arithmétique sur les noms : + - * / ( ) ^ et sqrt(...)), answer (nombre), unit, steps[] (le calcul étape par étape). Change les chiffres des exemples du cours : elle doit appliquer la règle, pas se souvenir du résultat.
- "speed" : ask, pairs[4-6] = [terme, définition courte].
- "explain" : ask, model (réponse attendue), keys[2-4] (les idées que la réponse doit contenir).
Preuve : chaque carte a "quote" et "page". "quote" = une phrase du cours sur la notion testée (la règle, la définition, la ligne de corrigé), recopiée MOT POUR MOT, 30 mots max, de la prose plutôt qu’une formule mise en forme : elle sert à vérifier que la carte vient du cours et à ouvrir la bonne page ; elle n’est pas montrée. L’explication, c’est "why". "page" = le numéro du marqueur [type · fichier · p. N]. N’invente rien qui ne soit pas dans le cours.`;

let mcp = null, drive = {state:'idle', items:[], path:[], err:'', added:{}};
(async () => { try { mcp = await window.claude?.use?.('mcp'); } catch(e){ mcp = null; } if (mcp) render(); })();
const schemas = {};
async function argName(tool, cands){
  try { const d = schemas[tool] || (schemas[tool] = await mcp.describeTool(DRIVE, tool)); const props = Object.keys(d?.inputSchema?.properties || {}); return cands.find(x => props.includes(x)) || props.find(x => /id/i.test(x)) || cands[0]; }
  catch(e){ return cands[0]; }
}
const DRIVE_ERR = {server_not_connected:'Google Drive n’est pas connecté à ton Claude. Dans Claude : Paramètres › Connecteurs › Google Drive, puis reviens ici.', needs_reauth:'Reconnecte Google Drive dans Claude (Paramètres › Connecteurs), puis réessaie.', not_in_manifest:'Tu n’as pas autorisé Buddy à lire ton Drive. Touche Réessayer pour qu’il te le redemande.', approval_required:'Buddy a besoin de ton accord pour lire ton Drive. Touche Réessayer.', selection_required:'Tu as plusieurs Google Drive connectés : choisis-en un dans la fenêtre de Claude.', blocked_by_policy:'Ton organisation bloque Google Drive ici.', server_unavailable:'Google Drive ne répond pas. Réessaie dans un instant.'};
const driveErr = e => DRIVE_ERR[e?.code] || (e?.plain) || ('Google Drive n’a pas répondu (' + (e?.code || 'erreur') + ').');
function payloadOf(r){ let p = r?.payload ?? r; if (typeof p === 'string') { try { p = JSON.parse(p); } catch(e){} } return p; }
function textOf_(r){
  const blocks = (r?.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  const p = payloadOf(r);
  if (typeof p === 'string') return p;
  for (const k of ['content', 'text', 'body', 'markdown', 'data']) if (typeof p?.[k] === 'string' && p[k].length > 40) return p[k];
  return blocks;
}
function driveFiles(r){
  const out = [], seen = new Set();
  const walk = v => { if (!v || typeof v !== 'object') return; if (Array.isArray(v)) return v.forEach(walk);
    const id = v.id || v.fileId || v.file_id, name = v.name || v.title || v.fileName;
    if (typeof id === 'string' && typeof name === 'string' && !seen.has(id)) { seen.add(id); out.push({id, name, mime: v.mimeType || v.mime_type || ''}); }
    Object.values(v).forEach(walk); };
  walk(payloadOf(r));
  if (!out.length) { const t = textOf_(r); for (const m of t.matchAll(/^\s*[-*\d.)]*\s*(.+?)\s*[\(\[]?\s*(?:ID|id|fileId)\s*[:=]\s*([A-Za-z0-9_-]{15,})/gm)) if (!seen.has(m[2])) { seen.add(m[2]); out.push({id:m[2], name:m[1].replace(/[*_`]/g, ''), mime: /dossier|folder/i.test(m[0]) ? 'application/vnd.google-apps.folder' : ''}); } }
  return out;
}
function findBase64(r){
  let hit = null;
  const walk = v => { if (hit || !v) return; if (typeof v === 'string') { if (v.length > 200 && /^[A-Za-z0-9+/=\s]+$/.test(v.slice(0, 400))) hit = v; return; } if (typeof v === 'object') Object.values(v).forEach(walk); };
  walk(r?.content); walk(payloadOf(r)); return hit;
}
const isFolder = f => /folder/.test(f.mime);
const extFor = (name, mime) => /\.[a-z0-9]{2,5}$/i.test(name) ? '' : /pdf/.test(mime) ? '.pdf' : /presentation/.test(mime) ? '.pptx' : /spreadsheet/.test(mime) ? '.xlsx' : /wordprocessing/.test(mime) ? '.docx' : /jpeg/.test(mime) ? '.jpg' : /png/.test(mime) ? '.png' : /text/.test(mime) ? '.txt' : '';
function pagesFromText(text){
  const parts = text.split(/\f|\n-{2,}\s*(?:page|Page)\s*\d+\s*-{2,}\n/).map(x => x.trim()).filter(Boolean);
  const pages = []; let p = 1;
  for (const part of parts) { if (part.length <= 3000) { pages.push({p: p++, text: part}); continue; } let buf = ''; for (const para of part.split(/\n+/)) { if ((buf + para).length > 2500 && buf) { pages.push({p: p++, text: buf.trim()}); buf = ''; } buf += para + '\n'; } if (buf.trim()) pages.push({p: p++, text: buf.trim()}); }
  return pages;
}
async function driveList(kind, arg){
  drive.state = 'loading'; drive.err = ''; drawSheet();
  try {
    let r;
    if (kind === 'recent') r = await mcp.callTool(DRIVE, 'list_recent_files', {});
    else { const a = await argName('search_files', ['query', 'q', 'search_query', 'searchQuery']); r = await mcp.callTool(DRIVE, 'search_files', {[a]: kind === 'folder' ? `'${arg}' in parents` : arg}); }
    drive.items = driveFiles(r); drive.state = 'ok';
    if (!drive.items.length) drive.err = kind === 'folder' ? 'Ce dossier est vide, ou je n’arrive pas à l’ouvrir : cherche tes fichiers par leur nom.' : 'Rien trouvé. Essaie un autre mot.';
  } catch(e){ drive.state = 'error'; drive.err = driveErr(e); }
  drawSheet();
}
async function driveRead(f){
  if (/google-apps\.(form|drawing|site|shortcut)/.test(f.mime)) throw {plain:'Ce type de fichier Google ne se lit pas ici : exporte-le en PDF dans Drive.'};
  if (/video|audio/.test(f.mime)) throw {plain:'Une vidéo ou un son ne se lit pas : ajoute plutôt les diapos ou les notes.'};
  try {
    const a = await argName('read_file_content', ['fileId', 'file_id', 'id']);
    const t = textOf_(await mcp.callTool(DRIVE, 'read_file_content', {[a]: f.id}));
    if (t && t.trim().length > 80) { const pages = pagesFromText(t); return {pages, unit:'page', how:'depuis Drive · ' + plural(pages.length, 'partie') + ' lue' + (pages.length > 1 ? 's' : '')}; }
  } catch(e){ if (['server_not_connected', 'needs_reauth', 'not_in_manifest', 'approval_required', 'blocked_by_policy'].includes(e?.code)) throw e; }
  const a = await argName('download_file_content', ['fileId', 'file_id', 'id']);
  const b64 = findBase64(await mcp.callTool(DRIVE, 'download_file_content', {[a]: f.id}));
  if (!b64) throw {plain:'Je n’ai pas pu ouvrir ce fichier depuis Drive. Télécharge-le, puis ajoute-le avec « + Ajouter des fichiers ».'};
  const bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const res = await readFile(new File([bytes], f.name + extFor(f.name, f.mime), {type: f.mime}));
  return {...res, how: 'depuis Drive · ' + res.how};
}
async function driveTree(root){
  const files = [], queue = [{f: root, path: ''}], seen = new Set();
  const a = await argName('search_files', ['query', 'q', 'search_query', 'searchQuery']);
  while (queue.length && files.length < 80) {
    const {f, path} = queue.shift(); if (seen.has(f.id)) continue; seen.add(f.id);
    reading = {name: root.name, detail: 'je parcours ' + (path ? path + ' › ' : '') + f.name, pct: .1}; drawSheet();
    const items = driveFiles(await mcp.callTool(DRIVE, 'search_files', {[a]: `'${f.id}' in parents`}));
    for (const it of items) { const p = (path ? path + ' › ' : '') + f.name; if (isFolder(it)) { if (p.split(' › ').length < 5) queue.push({f: it, path: p}); } else files.push({...it, folder: p}); }
  }
  return files;
}
async function driveAdd(list){
  const c = course(); if (!c || reading) return;
  if (c.example) { c.files = []; c.example = false; }
  for (const f of list) {
    if (isFolder(f) || c.files.some(x => x.driveId === f.id || x.name === f.name)) { drive.added[f.id] = true; continue; }
    reading = {name: f.name, detail:'depuis Drive', pct:.3}; drawSheet();
    const rec = {name: f.name, kind: KIND((f.folder || '') + '/' + f.name), driveId: f.id, folder: f.folder || ''};
    try { Object.assign(rec, await driveRead(f)); } catch(e){ rec.error = driveErr(e); rec.pages = []; }
    c.files.push(rec); drive.added[f.id] = true; save();
  }
  reading = null; drawSheet(); toast('Ajouté à ' + c.name + '.');
}
function driveSheet(c){
  const here = drive.path[drive.path.length - 1];
  const files = drive.items.filter(f => !isFolder(f));
  return `<div class="row between"><h2 style="font-size:26px">Mon Google Drive</h2><button class="icon" data-a="close" aria-label="Fermer">${ic('close')}</button></div>
  <form id="driveform" class="row" style="flex-wrap:nowrap"><input id="dq" placeholder="Cherche : opérations, partiel, TD…" autocomplete="off" style="flex:1;min-width:0;border-radius:99px"><button class="btn ink sm only" type="submit" aria-label="Chercher">${ic('search')}</button></form>
  ${drive.path.length ? `<div class="row" style="gap:6px"><button class="link" data-a="dhome" style="text-decoration:none">Drive</button>${drive.path.map(f => `<span class="muted">›</span><b class="small">${esc(f.name)}</b>`).join('')}</div>` : '<span class="label">Récents</span>'}
  ${here && drive.items.length ? `<button class="btn white" data-a="dall" ${reading ? 'disabled' : ''}>${ic('folder')}Ajouter tout ce dossier${drive.items.some(isFolder) ? ' et ses sous-dossiers' : ' (' + plural(files.length, 'fichier') + ')'}</button>` : ''}
  ${reading ? `<div class="file" style="flex-direction:column;align-items:stretch;gap:8px"><span class="nm"><b>${esc(reading.name)}</b><br><span class="muted">Je lis… ${esc(reading.detail)}</span></span><div class="bar"><i style="width:${Math.round((reading.pct || .05) * 100)}%"></i></div></div>` : ''}
  <div class="msgs">${drive.state === 'loading' ? '<p class="muted">Je regarde ton Drive…</p>' : drive.items.map(f => `<div class="file">${isFolder(f) ? `<button class="nm" data-a="dopen" data-v="${esc(f.id)}" style="text-align:left"><b>📁 ${esc(f.name)}</b></button><span class="muted">›</span>` : `<span class="nm"><b>${esc(f.name)}</b></span>${drive.added[f.id] ? '<span class="small" style="color:var(--green-ink);font-weight:600">Ajouté</span>' : `<button class="btn xs" data-a="dadd" data-v="${esc(f.id)}" ${reading ? 'disabled' : ''}>Ajouter</button>`}`}</div>`).join('')}
  ${drive.err ? `<p class="small" ${drive.state === 'error' ? 'style="color:#b4500a"' : 'class="muted"'}>${esc(drive.err)}</p>${drive.state === 'error' ? '<button class="btn white sm" data-a="dhome">Réessayer</button>' : ''}` : ''}</div>
  <p class="tiny muted">Buddy lit tes fichiers avec ton accès Google Drive dans Claude, seulement quand tu touches « Ajouter ».</p>`;
}

/* ================= game engine ================= */
function prep(k){
  const st = {done:false, ok:null};
  if (k.type === 'pick') st.opts = shuffle(k.options);
  if (k.type === 'order') { st.pool = shuffle(k.items); st.placed = []; }
  if (k.type === 'build') { st.pool = shuffle(k.items.concat(k.traps)); st.placed = []; }
  if (k.type === 'sort') { st.items = shuffle(k.items); st.i = 0; st.res = []; }
  if (k.type === 'speed') { st.left = shuffle(k.pairs.map(p => p[0])); st.right = shuffle(k.pairs.map(p => p[1])); st.gone = []; st.time = 25; st.started = false; st.errors = 0; }
  if (k.type === 'flash') st.flipped = false;
  return st;
}
function startGame(c, g, dropped){
  const cards = g.cards.filter(sound);
  if (!cards.length) { render(); return toast('Ce jeu vient d’une ancienne version de Buddy : crée un nouveau jeu.'); }
  dropped = (dropped || 0) + (g.review ? 0 : g.cards.length - cards.length);
  game = {courseId:c.id, gameId:g.id, title:g.title, review: !!g.review, daily: !!g.daily, cards, queue: cards.map(k => k.id), byId: Object.fromEntries(cards.map(k => [k.id, k])), retried:{}, first:{}, i:0, dropped: dropped || 0, t0: Date.now()};
  game.cur = game.queue.shift(); game.st = prep(game.byId[game.cur]);
  view = {name:'play', id:c.id}; render(); window.scrollTo(0,0);
}
let speedTimer = null;
function finish(ok, score){
  const g = game, k = g.byId[g.cur], st = g.st, c = S.courses.find(x => x.id === g.courseId);
  st.done = true; st.ok = ok; st.score = ok ? 1 : Math.max(0, Math.min(.99, score || 0)); clearInterval(speedTimer);
  if (!(g.cur in g.first)) g.first[g.cur] = ok;
  const keyOf = x => x.ask || x.front || x.title;
  if (!ok && !g.retried[g.cur] && k.type !== 'flash') { g.retried[g.cur] = true; g.queue.push(g.cur); }
  if (!ok && !c.review.some(r => keyOf(r) === keyOf(k))) c.review.push(k);
  if (ok && g.review) c.review = c.review.filter(r => keyOf(r) !== keyOf(k));
  save();
  if (k.type === 'flash') return next();
  render();
}
function next(){ const g = game; g.i++; g.cur = g.queue.shift(); if (g.cur) g.st = prep(g.byId[g.cur]); else g.t1 = Date.now(); render(); window.scrollTo(0,0); }

/* Partie du jour: a random mix of the games she already has, misses first. Free and instant. Claude writes only the very first game. */
function daily(c){
  const pool = c.games.flatMap(g => g.cards);
  if (!pool.length) { openNewGame(c); return; }
  const keyOf = x => x.ask || x.front || x.title, seen = new Set(), pick = [];
  for (const k of shuffle(c.review).concat(shuffle(pool))) { const id = keyOf(k); if (seen.has(id)) continue; seen.add(id); pick.push({...k, id: uid()}); if (pick.length >= 5) break; }
  startGame(c, {id:'daily', daily:true, title:'Partie du jour', cards: pick}, 0);
}

  if (sheet === 'exam') { const nf = c.files.filter(f => !f.error).length;
    if (sub === 'rename') return head('Renommer le cours', ['sub', '', 'Réglages']) + `<form id="cnameform" class="stack"><input id="cname2" value="${esc(c.name)}" aria-label="Nom du cours"><button class="btn" type="submit">Enregistrer</button></form>`;
    if (sub === 'delete') return head('Supprimer le cours ?') + confirmDel('Supprimer', `Ça supprime <b>${esc(c.name)}</b> : ${plural(nf, 'fichier')}, ${plural(c.games.length, 'jeu', 'jeux')} et ${plural(c.review.length, 'erreur')} à revoir. Tes fichiers d’origine ne sont pas touchés.`, 'rmcourse');
    return head('Réglages du cours') + `${examSetup(c)}
    <div class="rows" style="margin-top:6px"><button class="rowbtn" data-a="sub" data-v="rename">${ic('edit')}<span class="grow">Renommer le cours</span>${ic('next')}</button></div>
    <div class="rows" style="margin-top:10px"><button class="rowbtn red" data-a="sub" data-v="delete">${ic('trash')}<span class="grow">Supprimer le cours</span>${ic('next')}</button></div>`; }
  if (sheet === 'newgame') { const ng = newGame, ch = (k, v, l) => `<button class="chip" data-a="ng" data-k="${k}" data-v="${v}" aria-pressed="${String(ng[k]) === String(v)}">${l || v}</button>`;
    return head('Nouveau jeu') + `<span class="label">Ton objectif</span><div class="chips">${GOALS.map(v => ch('goal', v)).join('')}</div>${ng.goal === 'Autre' ? `<input id="nggoal" placeholder="Ex. maîtriser les écritures de fin d’année" value="${esc(ng.goalOther)}" aria-label="Ton objectif">` : ''}
    <span class="label">Sur quoi</span><div class="chips">${ch('on','all','Tout le cours')}${ch('on','part','Une partie')}${c.review.length ? ch('on','mistakes','Mes erreurs') : ''}</div>${ng.on === 'part' ? `<input id="ngpart" placeholder="la boucle de fidélité, le chapitre 2…" value="${esc(ng.part)}" aria-label="Quelle partie">` : ''}
    <span class="label">Le format des exercices</span><div class="chips">${Object.keys(TYPE_MIX).concat('Autre').map(v => ch('kind', v)).join('')}</div>${ng.kind === 'Autre' ? `<input id="ngkind" placeholder="Ex. écritures comptables, schémas, oral" value="${esc(ng.kindOther)}" aria-label="Format des exercices">` : ng.kind === 'Claude choisit' ? '<p class="tiny muted">Claude le choisit d’après ton objectif, tes annales et ton cours.</p>' : ''}
    <span class="label">Durée</span><div class="chips">${[5,10,15].map(v => ch('minutes', v, v + ' min')).join('')}</div>
    <div class="pin"><button class="btn" data-a="create">${ic('play')}Créer le jeu</button></div>`; }
  if (sheet === 'gmenu') { const g = c.games.find(x => x.id === gmenu); if (!g) return '';
    if (sub === 'rename') return head('Renommer le jeu', ['sub', '', g.title]) + `<form id="renameform" class="stack"><input id="gname" value="${esc(g.title)}" aria-label="Nom du jeu"><button class="btn" type="submit">Enregistrer</button></form>`;
    if (sub === 'delete') return head('Supprimer ce jeu ?') + confirmDel('Supprimer', `Ça supprime <b>${esc(g.title)}</b> et ses ${plural(g.cards.length, 'carte')}. Ton cours et tes erreurs à revoir restent.`, 'gdelete');
    if (sub === 'cards') return head('Les cartes', ['sub', '', g.title]) + `<div class="stack" style="gap:8px">${g.cards.map(k => `<div class="file"><span class="kind">${esc({pick:'Situation', sort:'Trier', order:'Ordre', build:'Construire', flash:'Flashcard', mistake:'Erreur', number:'Calcul', speed:'Speed', explain:'Rédiger'}[k.type] || k.type)}</span><span class="nm">${esc(k.ask || k.front || '')}</span><button class="btn xs" data-a="rmcard" data-v="${k.id}" aria-label="Retirer cette carte">Retirer</button></div>`).join('')}</div>`;
    return head(g.title) + `<button class="btn" data-a="play" data-v="${g.id}">${ic('play')}Jouer</button>
    <div class="rows"><button class="rowbtn" data-a="sub" data-v="cards">${ic('cards')}<span class="grow">Voir les cartes</span><span class="muted small">${g.cards.length}</span>${ic('next')}</button><button class="rowbtn" data-a="sub" data-v="rename">${ic('edit')}<span class="grow">Renommer le jeu</span>${ic('next')}</button></div><div class="rows" style="margin-top:10px"><button class="rowbtn red" data-a="sub" data-v="delete">${ic('trash')}<span class="grow">Supprimer le jeu</span>${ic('next')}</button></div>`; }
  if (sheet === 'drive') return driveSheet(c);
  if (sheet === 'ask') { const turns = chats[c.id] || [];
    return head('Pose une question') + `<div class="msgs">${turns.length ? turns.map((t, i) => `<div class="msg ${t.role === 'user' ? 'me' : 'ai'}" ${i === turns.length - 1 && t.role !== 'user' ? 'id="lastai"' : ''}>${t.role === 'user' ? esc(t.content) : t.content ? md(t.content) : '<span class="typing" aria-label="Claude écrit"><i></i><i></i><i></i></span>'}</div>`).join('') : `<p class="muted">Claude répond seulement d’après ton cours, avec la page.</p><div class="chips">${['Résume-moi le cours','Donne-moi un plan de dissert','C’est quoi la notion clé ?'].map(q => `<button class="chip" data-a="askchip" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}</div>
    <form id="askform" class="row" style="flex-wrap:nowrap"><input id="q" placeholder="Ta question sur le cours" autocomplete="off" style="flex:1;min-width:0;border-radius:99px"><button class="btn ink sm only" type="submit" aria-label="Envoyer" ${busy ? 'disabled' : ''}>${ic('up')}</button></form>`; }
  return '';
}
function drawSheet(){
  const host = document.getElementById('sheet');
  if (view.name === 'setup' && !sheet) { const y = window.scrollY; document.getElementById('app').innerHTML = setupScreen(); bindInputs(); window.scrollTo(0, y); }
  if (!sheet) { host.innerHTML = ''; return; }
  const cur = host.querySelector('.sheet');
  if (cur && cur.dataset.name === sheet) {
    const keep = ['q', 'dq'].map(id => { const el = document.getElementById(id); return el && {id, v: el.value, f: document.activeElement === el}; }).filter(Boolean), top = cur.scrollTop;
    cur.innerHTML = '<span class="grab"></span>' + sheetHtml(); cur.scrollTop = top;
    for (const k of keep) { const el = document.getElementById(k.id); if (el) { el.value = k.v; if (k.f) el.focus(); } }
  } else {
    const chat = sheet === 'ask' || sheet === 'drive';
    host.innerHTML = `<div class="scrim enter${chat ? ' drawer' : ''}" data-a="close"><div class="sheet${chat ? ' chat' : ''}" data-name="${sheet}" data-stop role="dialog" aria-modal="true"><span class="grab"></span>${sheetHtml()}</div></div>`;
  }
  bindInputs(); scrollChat();
}
function scrollChat(){ const m = document.querySelector('.sheet.chat .msgs'); if (m) m.scrollTop = m.scrollHeight; }
/* Claude answers in Markdown: show it formatted, never as raw ** and #. */
function md(src){
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, '$1<i>$2</i>');
  const out = []; let list = null;
  for (const raw of String(src || '').split('\n')) {
    const l = raw.trim();
    const li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { if (!list) { list = []; } list.push('<li>' + inline(li[1]) + '</li>'); continue; }
    if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; }
    if (!l) continue;
    const h = l.match(/^#{1,6}\s+(.*)/), bq = l.match(/^>\s?(.*)/);
    out.push(h ? '<h4>' + inline(h[1]) + '</h4>' : bq ? '<p style="border-left:3px solid var(--rim);padding-left:10px;color:var(--muted)">' + inline(bq[1]) + '</p>' : '<p>' + inline(l) + '</p>');
  }
  if (list) out.push('<ul>' + list.join('') + '</ul>');
  return out.join('');
}
function bindInputs(){
  const df = document.getElementById('driveform'); if (df) df.onsubmit = e => { e.preventDefault(); const q = document.getElementById('dq').value.trim(); if (q) { drive.path = []; driveList('search', q); } };
  const af = document.getElementById('askform'); if (af) af.onsubmit = e => { e.preventDefault(); const q = document.getElementById('q'); const v = q.value; q.value = ''; ask(v); };
  const nf = document.getElementById('newform'); if (nf) { nf.querySelector('input').focus(); nf.onsubmit = e => { e.preventDefault(); const n = document.getElementById('cname').value.trim(); if (!n) return; const c = newCourse(n); S.courses.push(c); S.welcomed = true; save(); view = {name:'setup', id:c.id}; render(); }; }
  const ed = document.getElementById('exdate'); if (ed) ed.onchange = () => { course().exam.date = ed.value; save(); };
  const np = document.getElementById('ngpart'); if (np) np.oninput = () => { newGame.part = np.value; };
  const ngg = document.getElementById('nggoal'); if (ngg) ngg.oninput = () => { newGame.goalOther = ngg.value; };
  const ngk = document.getElementById('ngkind'); if (ngk) ngk.oninput = () => { newGame.kindOther = ngk.value; };
  const cf = document.getElementById('cnameform'); if (cf) cf.onsubmit = e => { e.preventDefault(); const v = document.getElementById('cname2').value.trim(); if (v) { course().name = v; save(); toast('Cours renommé.'); } view.sub = null; render(); };
  const rf = document.getElementById('renameform'); if (rf) rf.onsubmit = e => { e.preventDefault(); const g = course().games.find(x => x.id === gmenu); const v = document.getElementById('gname').value.trim(); if (g && v) { g.title = v; save(); toast('Jeu renommé.'); } view.sub = null; render(); };
  const num = document.getElementById('num'); if (num) num.oninput = () => { game.st.val = num.value; };
}
function render(){
  const app = document.getElementById('app');
  if (view.name === 'making' && making) { document.getElementById('sheet').innerHTML = ''; return drawMaking(); }
  if (view.name === 'welcome' && app.querySelector('.intro')) { drawSheet(); return; }
  app.innerHTML = view.name === 'welcome' ? welcome() : view.name === 'new' ? newCourseScreen() : view.name === 'setup' ? setupScreen() : view.name === 'course' ? courseScreen() : view.name === 'making' ? makingScreen() : view.name === 'play' ? play() : home();
  if (view.name !== 'setup' || sheet) drawSheet(); else document.getElementById('sheet').innerHTML = ''; bindInputs();
}

/* ================= actions ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  if (t.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  const a = t.dataset.a, v = t.dataset.v, c = course(), g = game, st = g?.st, k = g ? g.byId[g.cur] : null;
  switch (a) {
    case 'intro': intro = {i:0, picked:null, played:false, show:false}; view = {name:'welcome'}; render(); return window.scrollTo(0, 0);
    case 'ipick': { if (intro.picked !== null) return; intro.picked = v; const host = document.getElementById('idemo'); host.innerHTML = introDemo(); if (v === INTRO[intro.i % INTRO.length].a) burst(host); return; }
    case 'inext': intro.i++; intro.picked = null; document.getElementById('idemo').innerHTML = introDemo(); return;
    case 'close': if (t.classList.contains('scrim') && e.target !== t) return; sheet = null; view.sub = null; return render();
    case 'sub': view.sub = v || null; return drawSheet();
    case 'sheet': sheet = v; view.sub = null; return drawSheet();
    case 'ishow': { intro.show = true; document.getElementById('app').innerHTML = welcome(); const d = document.getElementById('idemo'); if (d && innerWidth < 900) d.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    case 'reset': S = fresh(); save(); sheet = null; view = {name:'welcome'}; intro = {i:0, picked:null, played:false, show:false}; toast('Tout est effacé.'); return render();
    case 'home': view = {name:'home'}; return render();
    case 'new': view = {name:'new'}; return render();
    case 'open': S.welcomed = true; save(); view = {name:'course', id:v}; render(); return window.scrollTo(0,0);
    case 'upload': return document.getElementById('file').click();
    case 'upfolder': return document.getElementById('folder').click();
    case 'drive': sheet = 'drive'; drive = {state:'idle', items:[], path:[], err:'', added:{}}; drawSheet(); return driveList('recent');
    case 'dhome': drive.path = []; return driveList('recent');
    case 'dopen': { const f = drive.items.find(x => x.id === v); if (!f) return; drive.path.push(f); return driveList('folder', f.id); }
    case 'dadd': { const f = drive.items.find(x => x.id === v); return f ? driveAdd([f]) : null; }
    case 'dall': { const here = drive.path[drive.path.length - 1]; if (!here || reading) return; return (async () => { try { const all = await driveTree(here); reading = null; if (!all.length) { toast('Ce dossier est vide.'); return drawSheet(); } await driveAdd(all); } catch(e){ reading = null; drive.err = driveErr(e); drive.state = 'error'; drawSheet(); } })(); }
    case 'rmfile': { const at = +v, f = c.files.splice(at, 1)[0]; save(); const redraw = () => view.name === 'setup' ? render() : drawSheet(); toast((f?.name || 'Le fichier') + ' retiré.', () => { c.files.splice(at, 0, f); save(); redraw(); }); return redraw(); }
    case 'exam': { const kk = t.dataset.k; c.exam[kk] = v; save(); return view.name === 'setup' ? render() : drawSheet(); }
    case 'go-course': view = {name:'course', id:c.id}; return render();
    case 'rmcourse': S.courses = S.courses.filter(x => x.id !== c.id); save(); sheet = null; view = {name:'home'}; toast(c.name + ' supprimé.'); return render();
    case 'daily': return daily(c);
    case 'ng': { const kk = t.dataset.k; newGame[kk] = kk === 'minutes' ? +v : v; return drawSheet(); }
    case 'newgame': return openNewGame(c);
    case 'create': c.lastNew = {goal: newGame.goal, goalOther: newGame.goalOther, kind: newGame.kind, kindOther: newGame.kindOther, minutes: newGame.minutes}; save(); return makeGame({...newGame});
    case 'play': { const gg = c.games.find(x => x.id === v); sheet = null; return startGame(c, gg, 0); }
    case 'gmenu': gmenu = v; sheet = 'gmenu'; view.sub = null; return drawSheet();
    case 'rmcard': { const g = c.games.find(x => x.id === gmenu); if (!g) return; const before = g.cards.slice(); g.cards = g.cards.filter(k => k.id !== v); if (!g.cards.length) { c.games = c.games.filter(x => x.id !== g.id); sheet = null; save(); toast('Dernière carte retirée : le jeu est supprimé.'); return render(); } save(); toast('Carte retirée.', () => { g.cards = before; save(); drawSheet(); }); return drawSheet(); }
    case 'gdelete': c.games = c.games.filter(x => x.id !== gmenu); save(); sheet = null; toast('Jeu supprimé.'); return render();
    case 'review': return startGame(c, {id:'review', review:true, title:'À revoir', cards: shuffle(c.review).slice(0, 8).map(x => ({...x, id: uid()}))}, 0);
    case 'askchip': return ask(v);
    case 'sel': if (st.done) return; st.sel = v; return render();
    case 'line': if (st.done) return; st.sel = +v; return render();
    case 'place': st.placed.push(v); return render();
    case 'unplace': if (st.done) return; st.placed.splice(+v, 1); return render();
    case 'hint': st.hint = true; return render();
    case 'srcopen': st.showSrc = !st.showSrc; render(); { const m = document.querySelector('.verdict mark'), box = m?.closest('.quote'); if (box) box.scrollTop = m.offsetTop - box.offsetTop - 8; } return;
    case 'flip': st.flipped = !st.flipped; return render();
    case 'flashyes': return finish(true);
    case 'flashno': return finish(false);
    case 'bucket': { const it = st.items[st.i]; st.res.push({text: it.text, ok: it.bucket === v}); st.i++; if (st.i >= st.items.length) return finish(st.res.every(r => r.ok), st.res.filter(r => r.ok).length / st.res.length); return render(); }
    case 'speedgo': st.started = true; speedTimer = setInterval(() => { st.time--; if (st.time <= 0) { st.time = 0; return finish(false, st.gone.length / k.pairs.length); } render(); }, 1000); return render();
    case 'L': st.pickL = v; return render();
    case 'R': { if (!st.pickL) return; const p = k.pairs.find(p => p[0] === st.pickL); if (p[1] === v) { st.gone.push(st.pickL); if (st.gone.length === k.pairs.length) { st.pickL = null; return finish(true); } } else { st.errors++; toast('Pas cette paire.'); } st.pickL = null; return render(); }
    case 'grade': return gradeExplain();
    case 'check': {
      let ok = false;
      if (k.type === 'pick') ok = st.sel === k.answer;
      let score = 0;
      if (k.type === 'order' || k.type === 'build') { ok = st.placed.every((x, i) => x === k.items[i]) && st.placed.length === k.items.length; score = st.placed.filter((x, i) => x === k.items[i]).length / k.items.length; }
      if (k.type === 'mistake') ok = st.sel === +k.answer;
      if (k.type === 'number') { const val = parseFloat(String(st.val ?? document.getElementById('num')?.value ?? '').replace(',', '.').replace(/\s/g, '')); if (isNaN(val)) return toast('Écris un nombre.'); st.val = val; ok = Math.abs(val - +k.answer) <= Math.max(.01, Math.abs(+k.answer) * .01); }
      return finish(ok, score);
    }
    case 'next': return next();
    case 'quit': clearInterval(speedTimer); game = null; view = {name:'course', id:view.id}; render(); return window.scrollTo(0,0);
    case 'continue': game = null; view = {name:'course', id:view.id}; render(); return window.scrollTo(0,0);
    case 'replay-now': { if (g.daily) return daily(c); const gg = c.games.find(x => x.id === g.gameId); return gg ? startGame(c, gg, 0) : null; }
  }
});
render();
idbGet(KEY).then(s => { loaded = true; if (s && s.courses) { S = s; if (view.name === 'welcome' && S.welcomed) view = {name:'home'}; render(); } else save(); }).catch(() => { loaded = true; });
</script>
