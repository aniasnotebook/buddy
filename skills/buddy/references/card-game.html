<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--paper:#fcfbf7;--dot:#e2ddd0;--ink:#1a1916;--muted:#5a5847;--line:#d9d4c7;--card:#fff;--chalk:#f0679a;--chalk-soft:#fde3ec;--done:#7fcf98;--right-bg:#e2f4e8;--right-ink:#1d5c33;--miss-bg:#fde6dc;--miss-ink:#8a2e12;
--disp:'Bricolage Grotesque',Manrope,system-ui,sans-serif;--body:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font:500 16px/1.5 var(--body);padding:16px}
button{font:inherit;color:inherit;cursor:pointer} :focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.bar{height:8px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--card)} .bar i{display:block;height:100%;background:var(--chalk);transition:width .2s}
.goal{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
h1,h2{margin:0;font-family:var(--disp);font-weight:800;line-height:1.12;text-wrap:balance} h1{font-size:44px} h2{font-size:24px}
p{margin:0}
.opt{text-align:left;min-height:50px;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 14px;font-weight:700}
.opt.good{background:var(--right-bg)} .opt.bad{background:var(--miss-bg)} .opt.sel{background:var(--chalk-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
input{width:100%;min-width:0;height:56px;border:2px solid var(--ink);border-radius:12px;padding:0 14px;font:800 24px var(--disp);background:var(--card)}
.btn{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:17px}
.btn[disabled]{opacity:.35} .btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.fb{border:2px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--right-bg)} .fb.no{background:var(--miss-bg)}
.fb b.h{font-family:var(--disp);font-size:20px} .fb.ok b.h{color:var(--right-ink)} .fb.no b.h{color:var(--miss-ink)}
.src{font-size:13px;color:var(--muted)} .quote{border-left:4px solid var(--chalk);padding:4px 10px;background:var(--chalk-soft);font-size:14px;border-radius:0 8px 8px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px} .pool button{min-height:44px;border:2px solid var(--ink);border-radius:99px;background:var(--card);padding:6px 12px;font-weight:700;font-size:14px}
.slot{min-height:42px;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;font-weight:700} .slot.full{border:2px solid var(--ink);background:var(--card)}
.line{text-align:left;width:100%;border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:8px 10px;font:700 15px var(--body)}
.list{background:var(--card);border:2px solid var(--ink);border-radius:14px;overflow:hidden} .list div{padding:8px 12px;border-top:1px solid var(--line)} .list div:first-child{border-top:0}
.recall{min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (prefers-reduced-motion:no-preference){.fb.ok{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.97)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== SESSION: Claude replaces only this block ===== */
const SESSION = {
  "course": "Example course",
  "goal": "Example goal",
  "exercises": [
    {"type":"pick","label":"Example label","ask":"Example question?","options":["Right","Wrong 1","Wrong 2","Wrong 3"],"answer":"Right","why":"Why it is right.","why_wrong":{"Wrong 1":"Why it tempts, and why it is wrong."},"quote":"word for word from the course","source":"file.pdf, p. 1","level":"remember","difficulty":1}
  ],
  "next_time": "What comes next time"
};
/* ===== end of SESSION ===== */

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function calc(f, v){ // only + - * / ( ), numbers and names
  const t = String(f).match(/\d+(\.\d+)?|[A-Za-z_][A-Za-z0-9_]*|[-+*/()]/g) || []; if (t.join('') !== String(f).replace(/\s/g,'')) throw 0;
  let i = 0; const P = () => { const x = t[i++]; if (x === '(') { const r = E(); i++; return r; } if (x === '-') return -P(); if (/^\d/.test(x)) return +x; if (x in v) return +v[x]; throw 0; };
  const T = () => { let r = P(); while (t[i] === '*' || t[i] === '/') { const o = t[i++], y = P(); r = o === '*' ? r*y : r/y; } return r; };
  const E = () => { let r = T(); while (t[i] === '+' || t[i] === '-') { const o = t[i++], y = T(); r = o === '+' ? r+y : r-y; } return r; };
  return E();
}
const num = s => { let x = String(s).trim().toLowerCase().replace(/[a-z€$£%]/g,'').replace(/\s/g,''); if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(x)) x = x.replace(/,/g,''); else x = x.replace(',', '.'); return /^-?\d+(\.\d+)?$/.test(x) ? +x : null; };
let dropped = 0;
const deck = (SESSION.exercises || []).filter(e => {
  let ok = !!e.ask && !!e.quote;
  if (['pick','case'].includes(e.type)) ok = ok && Array.isArray(e.options) && e.options.includes(e.answer);
  if (e.type === 'number') { try { ok = ok && Math.abs(calc(e.formula, e.numbers || {}) - e.answer) <= Math.max(0.5, Math.abs(e.answer) * 0.01); } catch (x) { ok = false; } }
  if (e.type === 'order') ok = ok && Array.isArray(e.items) && e.items.length > 1;
  if (e.type === 'mistake') ok = ok && Array.isArray(e.lines) && Number.isInteger(e.answer) && e.answer >= 0 && e.answer < e.lines.length;
  if (!ok) dropped++; return ok;
}).map((e, i) => ({...e, id: i}));
let queue = deck.slice(), done = [], cur = null, st = {}, returned = new Set();
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

function next(){
  cur = queue.shift(); st = {};
  if (cur && cur.type === 'order') st.pool = shuffle(cur.items), st.placed = [];
  if (cur && ['pick','case'].includes(cur.type)) st.opts = shuffle(cur.options);
  render();
}
function answer(ok){
  st.done = true; st.ok = ok;
  done.push({id: cur.id, ok, label: cur.label || cur.ask});
  if (!ok && !returned.has(cur.id)) { returned.add(cur.id); queue.splice(Math.min(2, queue.length), 0, cur); }   // comes back a few cards later, once
  render();
}
function render(){
  if (!cur) return end();
  const total = deck.length + returned.size, pos = done.length + (st.done ? 0 : 1);
  let body = '';
  const t = cur.type;
  if (t === 'pick' || t === 'case') body = `<div class="opts">${st.opts.map(o => { let c = ''; if (st.done) c = o === cur.answer ? 'good' : o === st.pick ? 'bad' : ''; return `<button class="opt ${c}" data-pick="${esc(o)}" ${st.done ? 'disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>`;
  if (t === 'number') body = `<label class="src" for="n">Your answer${cur.unit ? ' (' + esc(cur.unit) + ')' : ''}</label><input id="n" inputmode="decimal" autocomplete="off" ${st.done ? 'disabled value="' + esc(st.typed) + '"' : ''}>${st.done ? '' : '<button class="btn" id="chk" disabled>Check</button>'}`;
  if (t === 'order') body = `${st.done ? '' : `<div class="pool">${st.pool.filter(x => !st.placed.includes(x)).map(x => `<button data-place="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}<div class="opts">${cur.items.map((_, i) => `<div class="slot ${st.placed[i] ? 'full' : ''}">${i + 1}. ${esc(st.placed[i] || '')}</div>`).join('')}</div>${st.done ? '' : `<div class="row2"><button class="btn ghost" id="undo">Undo</button><button class="btn" id="chk" ${st.placed.length === cur.items.length ? '' : 'disabled'}>Check</button></div>`}`;
  if (t === 'recall') body = st.flipped ? `<div class="card recall"><h2>${esc(cur.answer)}</h2></div>${st.done ? '' : '<div class="row2"><button class="btn ghost" data-self="0">To review</button><button class="btn" data-self="1">Knew it</button></div>'}` : `<button class="btn ghost" id="flip">Show the answer</button>`;
  if (t === 'mistake') body = `<div class="opts">${cur.lines.map((l, i) => { let c = ''; if (st.done) c = i === cur.answer ? 'good' : i === st.pick ? 'bad' : ''; return `<button class="line opt ${c}" data-line="${i}" ${st.done ? 'disabled' : ''}>${esc(l)}</button>`; }).join('')}</div>`;
  let fb = '';
  if (st.done) {
    const right = t === 'number' ? cur.answer : t === 'order' ? cur.items.join(' → ') : t === 'mistake' ? cur.lines[cur.answer] : t === 'recall' ? '' : cur.answer;
    const wrongWhy = !st.ok && cur.why_wrong && st.pick && cur.why_wrong[st.pick] ? `<p>${esc(cur.why_wrong[st.pick])}</p>` : '';
    fb = `<div class="fb ${st.ok ? 'ok' : 'no'}" role="status"><b class="h">${st.ok ? 'Right' : t === 'recall' ? 'To review' : 'Not quite'}</b>${!st.ok && right !== '' ? `<p><b>Answer:</b> ${esc(right)}${t === 'number' && cur.formula ? ' (' + esc(cur.formula) + ')' : ''}</p>` : ''}${wrongWhy}<p>${esc(cur.why)}</p><p class="quote">"${esc(cur.quote)}"</p><p class="src">${esc(cur.source || '')}${!st.ok && !returned.has(cur.id) ? '' : !st.ok ? ' · comes back in a few cards' : ''}</p><button class="btn" id="go">${queue.length ? 'Next' : 'See the round'}</button></div>`;
  }
  app.innerHTML = `<div class="top"><span>${esc(SESSION.course)}</span><span>${Math.min(pos, total)} of ${total}</span></div>
    <div class="bar"><i style="width:${Math.round(done.length / Math.max(total, 1) * 100)}%"></i></div>
    <p class="goal">${esc(SESSION.goal)}</p>
    <div class="card">${cur.situation ? `<p>${esc(cur.situation)}</p>` : ''}<h2>${esc(cur.ask)}</h2></div>${body}${fb}`;
  bind();
}
function end(){
  const byId = {}; done.forEach(d => { (byId[d.id] = byId[d.id] || []).push(d.ok); });
  const solid = deck.filter(e => byId[e.id] && byId[e.id][0]), shaky = deck.filter(e => byId[e.id] && !byId[e.id][0]);
  const first = deck.length ? Math.round(solid.length / deck.length * 100) : 0;
  const line = `Results · ${SESSION.course} · ${SESSION.goal} · first try ${solid.length}/${deck.length} · shaky: ${shaky.map(e => e.label || e.ask).join(' | ') || 'none'}`;
  app.innerHTML = `<p class="goal">Round done</p><h1>${solid.length} of ${deck.length}</h1><p>right on the first try${first >= 80 ? '. Solid.' : '.'}</p>
    ${dropped ? `<p class="src">${dropped} card${dropped > 1 ? 's were' : ' was'} left out: ${dropped > 1 ? 'their' : 'its'} answer didn't check out.</p>` : ''}
    <div class="list">${deck.map(e => `<div>${byId[e.id] && byId[e.id][0] ? '✓' : '✗'} ${esc(e.label || e.ask)}</div>`).join('')}</div>
    <p><b>Next time:</b> ${esc(SESSION.next_time || '')}</p>
    <button class="btn" id="copy">Copy my results</button><p class="src" id="cm">Then paste them in the chat, so Claude plans your next session.</p>
    <textarea id="rl" readonly style="width:100%;min-height:70px;border:2px solid var(--line);border-radius:10px;padding:8px;font:13px var(--body)" hidden>${esc(line)}</textarea>`;
  document.getElementById('copy').onclick = async () => { const ta = document.getElementById('rl'); try { await navigator.clipboard.writeText(ta.value); document.getElementById('cm').textContent = 'Copied. Paste it in the chat.'; } catch (x) { ta.hidden = false; ta.select(); document.getElementById('cm').textContent = 'Select the line below and copy it.'; } };
}
function bind(){
  const g = id => document.getElementById(id);
  app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { st.pick = b.dataset.pick; answer(st.pick === cur.answer); });
  app.querySelectorAll('[data-line]').forEach(b => b.onclick = () => { st.pick = +b.dataset.line; answer(st.pick === cur.answer); });
  app.querySelectorAll('[data-place]').forEach(b => b.onclick = () => { st.placed.push(b.dataset.place); render(); });
  app.querySelectorAll('[data-self]').forEach(b => b.onclick = () => answer(b.dataset.self === '1'));
  if (g('flip')) g('flip').onclick = () => { st.flipped = true; render(); };
  if (g('undo')) g('undo').onclick = () => { st.placed.pop(); render(); };
  const n = g('n'); if (n && !st.done) { n.focus({preventScroll:true}); n.oninput = () => { g('chk').disabled = num(n.value) === null; }; n.onkeydown = e => { if (e.key === 'Enter' && num(n.value) !== null) g('chk').click(); }; }
  if (g('chk')) g('chk').onclick = () => { if (cur.type === 'number') { st.typed = n.value; const v = num(n.value); answer(Math.abs(v - cur.answer) <= Math.max(0.5, Math.abs(cur.answer) * 0.01)); } else answer(st.placed.every((x, i) => x === cur.items[i])); };
  if (g('go')) g('go').onclick = next;
}
next();
</script>
</body>
</html>
