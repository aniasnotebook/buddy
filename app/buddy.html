<title>Buddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Buddy, look C. Phone: one column, the stage on top, the button at the bottom. From 900px: courses in a sidebar, the stage on the left, her move on the right.
   Deliberately one light look (plain white), as agreed. */
:root{
  --white:#ffffff; --ink:#111111; --muted:#737373; --rim:#e6e6e6; --mist:#f5f5f5;
  --pink:#f06a98; --pink-tint:#fde3ec; --green:#7fee64; --green-ink:#2f6b1f; --orange:#ff7a45; --orange-tint:#fff1ea;
  --disp:'Titan One','Arial Black',sans-serif; --body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --press:0 4px 0 rgba(0,0,0,.2); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--white);color:var(--ink);font:16px/1.5 var(--body);letter-spacing:-.01em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:1180px;margin:0 auto;padding-block:16px 120px;min-height:100%}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:400;line-height:1.05;text-wrap:balance;letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
/* brand: logo A1, the two d's on cards */
.word{display:inline-flex;align-items:flex-end;white-space:nowrap;font-family:var(--disp);line-height:1}
.word .dc{display:inline-flex;align-items:center;justify-content:center;width:.62em;height:.98em;border-radius:.14em;margin:0 -.02em;vertical-align:-.12em}
.word .dc span{font-size:.82em;line-height:1}
.dc.p{background:var(--pink);color:var(--ink);transform:rotate(-8deg)} .dc.k{background:var(--ink);color:var(--white);transform:rotate(7deg)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;background:var(--pink);color:var(--ink);box-shadow:var(--press);font-weight:600;font-size:16px;padding:0 20px;width:100%;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ink{background:var(--ink);color:var(--white)}
.btn.white{background:var(--white);border:2px solid var(--rim);box-shadow:0 4px 0 var(--rim)}
.btn:disabled{background:var(--rim);color:#8a8a8a;box-shadow:0 4px 0 #d6d6d6;cursor:default;transform:none}
.btn.sm{min-height:44px;width:auto;font-size:14px;border-radius:12px}
.link{font-weight:600;text-decoration:underline;color:var(--muted);min-height:40px;display:inline-flex;align-items:center}
.icon{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.icon:hover{background:var(--mist)}
.chip{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:99px;background:var(--mist);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input,textarea{font:inherit;color:var(--ink);background:var(--white);border:2px solid var(--rim);border-radius:14px;min-height:50px;padding:10px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.card{background:var(--white);border:1px solid var(--rim);border-radius:24px;padding:22px}
.dot{display:inline-block;width:10px;height:10px;border-radius:99px;flex:none}
.dot.ok{background:var(--green)} .dot.no{background:var(--orange)}
.quote{padding:10px 12px;border-radius:12px;background:var(--mist);font:13px/1.5 var(--mono)}
/* layout: courses sidebar on computers */
.shell{display:block}
.side{display:none}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
}
.side .c{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:12px 14px;font-weight:600;text-align:left;width:100%}
.side .c[aria-current="true"]{background:var(--ink);color:var(--white)}
.side .c[aria-current="true"] .label{color:#a3a3a3}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
/* lists */
.list{display:flex;flex-direction:column;border:1px solid var(--rim);border-radius:20px;overflow:hidden}
.list>*{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--rim);text-align:left;width:100%;min-height:56px}
.list>*:last-child{border-bottom:0}
.courses{display:flex;flex-direction:column;gap:10px}
.course{display:flex;align-items:center;gap:14px;border:1px solid var(--rim);border-radius:20px;padding:16px;text-align:left;width:100%;min-height:76px}
.course .ini{width:44px;height:44px;border-radius:12px;background:var(--mist);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:20px;flex:none}
.course .meta{flex:1;min-width:0}
.course b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:20px;border:2px dashed var(--rim);color:var(--muted);font-weight:600;width:100%}
.day{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.day .deco{position:absolute;right:-24px;top:-24px;width:110px;height:110px;border-radius:28px;background:var(--pink);transform:rotate(14deg)}
.day h2{font-size:48px}
.top2{display:grid;gap:18px}
@media (min-width:900px){.top2{grid-template-columns:1.2fr 1fr;align-items:start}}
.game{display:flex;align-items:center;gap:12px;border:1px solid var(--rim);border-radius:18px;padding:12px 14px}
.game .sc{width:40px;height:52px;border-radius:10px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;transform:rotate(-5deg);flex:none;font-family:var(--disp);font-size:20px;color:var(--pink)}
.game .tx{flex:1;min-width:0;text-align:left}
.banner{display:flex;align-items:center;gap:10px;border-radius:16px;background:var(--ink);color:var(--white);padding:12px 14px;font-size:14px}
/* files */
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--rim);border-radius:14px;padding:10px 12px}
.file.bad{border-color:var(--orange);background:var(--orange-tint)}
.file .kind{width:58px;flex:none;font:500 11px/1.3 var(--mono);text-transform:uppercase}
.file .nm{flex:1;min-width:0;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--white);border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:28px;max-height:80vh}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--rim);align-self:center}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;font-size:15px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--white);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--mist);border-bottom-left-radius:6px}
/* the game */
.g{display:flex;flex-direction:column;gap:16px;padding-bottom:110px}
.gtop{display:flex;align-items:center;gap:14px}
.segs{flex:1;display:flex;gap:4px} .segs i{flex:1;height:5px;border-radius:3px;background:var(--rim);transition:background .3s} .segs i.on{background:var(--pink)}
.stage{background:var(--ink);color:var(--white);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;animation:in .28s cubic-bezier(.2,.8,.2,1)}
.stage .label{color:#a3a3a3}
.stage .sit{color:#d4d4d4;font-size:16px;line-height:1.45}
.stage .q{font-family:var(--body);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.move{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;border-radius:16px;background:var(--white);border:2px solid var(--rim);border-bottom-width:4px;padding:10px 16px;font-weight:600;font-size:17px;text-align:left;width:100%;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.sel{background:var(--pink-tint);border-color:var(--pink)}
.opt.good{border-color:var(--ink)} .opt.bad{background:var(--orange-tint);border-color:var(--orange)} .opt.fade{opacity:.35}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{display:inline-flex;align-items:center;min-height:44px;border-radius:14px;background:var(--white);border:2px solid var(--rim);border-bottom-width:4px;padding:8px 12px;font-weight:600;font-size:15px;text-align:left;animation:pop .18s ease-out}
.pc.on{border-color:var(--ink)} .pc.good{background:#f0fde9;border-color:#2f8a4a} .pc.bad{background:var(--orange-tint);border-color:var(--orange)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.answer{min-height:70px;border-radius:16px;border:2px dashed var(--rim);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.answer:empty::before{content:attr(data-empty);color:var(--muted);font-size:14px;padding:8px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px}
.slot .n{width:18px;font:500 11px var(--mono);color:var(--muted)}
.slot .e{flex:1;min-height:44px;border-radius:14px;background:var(--mist);border:2px dashed var(--rim)}
.line{display:flex;gap:8px;padding:12px 14px;border-radius:14px;background:var(--mist);border:2px solid transparent;font-size:16px;text-align:left;width:100%}
.line.sel{background:var(--pink-tint);border-color:var(--pink)} .line.good{background:#f0fde9;border-color:#2f8a4a} .line.bad{background:var(--orange-tint);border-color:var(--orange)}
.flash{perspective:1200px;display:flex;justify-content:center}
.flash button{width:min(320px,100%);height:380px;border-radius:28px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .45s}
.flash .front{background:var(--ink);color:var(--white)} .flash .back{background:var(--white);border:2px solid var(--ink);border-bottom-width:5px}
.flash .front h3{font-size:34px}
.timer{height:6px;border-radius:3px;background:#333;overflow:hidden} .timer i{display:block;height:100%;background:var(--pink);transition:width 1s linear}
.done-tags{display:flex;gap:6px;flex-wrap:wrap}
.done-tags span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:#f0fde9;color:var(--green-ink)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--white) 70%,rgba(255,255,255,0))}
.dock>div{max-width:560px;margin:0 auto}
.verdict{border-radius:26px;border:1px solid var(--rim);background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:20px;display:flex;flex-direction:column;gap:10px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.verdict .w{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:26px}
.keys{display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (min-width:900px){
  .g{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:start;padding-bottom:40px}
  .g .gtop{grid-column:1 / -1}
  .g .stage{position:sticky;top:16px;min-height:420px;justify-content:center}
  .g .stage .q{font-size:34px}
  .dock{position:static;padding:0;background:none;margin-top:8px}
  .dock>div{max-width:none}
}
/* making / loaders, from logo A1 */
.making{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.pair{display:flex;gap:6px}
.pair .dc{font-size:96px}
.five .p{animation:bd-l 1.1s ease-in-out infinite;transform-origin:bottom right} .five .k{animation:bd-r 1.1s ease-in-out infinite;transform-origin:bottom left}
.shuf{position:relative;width:150px;height:100px} .shuf .dc{position:absolute;top:0;font-size:90px} .shuf .p{left:10px;animation:bd-sa 1.4s ease-in-out infinite} .shuf .k{left:72px;animation:bd-sb 1.4s ease-in-out infinite}
.steps{display:flex;flex-direction:column;gap:10px;font-weight:600;text-align:left}
.steps div{display:flex;gap:10px;align-items:center;color:#a3a3a3} .steps .on{color:var(--ink)} .steps .ok{color:var(--ink)}
.steps .dot{background:var(--rim)} .steps .on .dot{background:var(--pink);animation:pulse 1s infinite} .steps .ok .dot{background:var(--green)}
.nod{display:inline-flex;gap:4px;margin-left:8px} .nod span{display:inline-flex;width:16px;height:22px;border-radius:5px;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;animation:bd-nod .9s ease-in-out infinite} .nod span:first-child{background:var(--white);color:var(--ink)} .nod span:last-child{background:var(--ink);color:var(--white);animation-delay:.15s}
/* end */
.end{min-height:76vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.medal{width:100px;height:100px;border-radius:28px;background:var(--pink);transform:rotate(-8deg);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:48px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px}
.stats div{border:1px solid var(--rim);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats b{font-family:var(--disp);font-weight:400;font-size:26px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:99px;padding:10px 18px;font-weight:600;font-size:14px;z-index:40;max-width:92%;text-align:center;animation:drop .2s}
.welcome{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:560px;margin:0 auto}
.welcome h1{font-size:44px}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes in{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes pulse{50%{transform:scale(1.4)}}
@keyframes bd-l{0%,100%{transform:rotate(-8deg)}45%{transform:rotate(4deg) translateX(6px)}55%{transform:rotate(2deg) translateX(3px)}}
@keyframes bd-r{0%,100%{transform:rotate(7deg)}45%{transform:rotate(-4deg) translateX(-6px)}55%{transform:rotate(-2deg) translateX(-3px)}}
@keyframes bd-sa{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(62px,-12px) rotate(8deg)}}
@keyframes bd-sb{0%,100%{transform:translate(0,0) rotate(7deg)}50%{transform:translate(-62px,12px) rotate(-7deg)}}
@keyframes bd-nod{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-4px) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app"></div>
<div id="sheet"></div>
<input type="file" id="file" multiple hidden accept=".pdf,.pptx,.docx,.txt,.md,.csv,.png,.jpg,.jpeg,.webp,.heic,application/pdf,image/*,text/plain">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ================= state, kept in this browser ================= */
const KEY = 'buddy-v1';
const EX_PAGES = [
 {p:1, text:"TD 3 · Le parcours client. Le parcours client se découpe en trois étapes : le pré-achat, l'achat et le post-achat. Le pré-achat regroupe tout ce qui se passe avant la transaction : le client reconnaît un besoin, cherche des informations et compare des offres. L'achat couvre le choix, la commande et le paiement ; c'est en général l'étape la plus courte. Le post-achat commence après la transaction : le client utilise le produit, contacte le service après-vente et donne parfois son avis."},
 {p:2, text:"À chaque étape, le client croise des points de contact. On en distingue quatre types selon qui les contrôle. Les points de contact brand-owned sont conçus et gérés par la marque, comme son site, son appli ou son packaging. Les points de contact partner-owned sont gérés avec des partenaires, comme une agence ou un distributeur. Les points de contact customer-owned dépendent du client seul, comme sa propre réflexion sur ses besoins. Les points de contact social/external échappent à la marque, comme les avis en ligne ou un influenceur indépendant. Au post-achat, un déclencheur mène soit à la fidélité, avec un rachat, soit à un retour au pré-achat où le client compare d'autres offres : c'est la boucle de fidélité."}];
const newCourse = (name, example) => ({id: example ? 'ex' : 'c' + Date.now(), name, example: !!example, created: Date.now(), fresh: true,
  exam: {format: example ? 'Dissertation' : '', other: '', when: 'none', date: ''}, files: example ? [{name:'TD3 parcours client (exemple).txt', kind:'Cours', pages: EX_PAGES, unit:'page'}] : [], games: [], review: []});
const fresh = () => ({welcomed:false, courses:[newCourse('Marketing · parcours client', true)]});
const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.courses) return s; } catch(e){} return fresh(); };
let S = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Plus de place dans ce navigateur : retire un gros fichier.'); } };
let view = {name: S.welcomed ? 'home' : 'welcome'}, game = null, busy = false, sheet = null, making = null, reading = null;
const chats = {};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const course = () => S.courses.find(c => c.id === view.id);
const textOf = c => c.files.filter(f => f.pages && f.pages.length).map(f => f.pages.map(pg => `[${f.kind} · ${f.name} · ${f.unit === 'diapo' ? 'diapo' : 'p.'} ${pg.p}]\n${pg.text}`).join('\n\n')).join('\n\n');
const norm = s => String(s).normalize('NFKC').toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”«»]/g,'"').replace(/-\s+/g,'-').replace(/\s+/g,' ').trim();
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const plural = (n, w, ws) => n + ' ' + (n > 1 ? (ws || w + 's') : w);
const daysTo = c => { const e = c.exam; let d = null; if (e.when === 'exact' && e.date) d = new Date(e.date + 'T00:00:00'); if (e.when === '2w') d = new Date((c.created || Date.now()) + 14 * 864e5); if (!d) return null; const n = new Date(); n.setHours(0,0,0,0); return Math.round((d - n) / 864e5); };
const fmt = c => c.exam.format === 'Autre' ? (c.exam.other || 'Autre') : (c.exam.format || 'Juste comprendre');
const uid = () => Math.random().toString(36).slice(2, 9);
let toastEl; function toast(t){ toastEl?.remove(); toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role','status'); toastEl.textContent = t; document.body.append(toastEl); setTimeout(() => toastEl?.remove(), 3200); }
const word = (size, ink) => `<span class="word" style="font-size:${size}px;color:${ink || 'var(--ink)'}" role="img" aria-label="Buddy">Bu<span class="dc p"><span>d</span></span><span class="dc k"><span>d</span></span>y</span>`;
const pair = cls => `<div class="pair ${cls}" aria-hidden="true"><span class="word" style="font-size:96px"><span class="dc p"><span>d</span></span><span class="dc k"><span>d</span></span></span></div>`;

/* ================= Claude, on her own account ================= */
let sample = null, canImages = false, claudeState = 'wait';
function fromComplete(complete){
  const flat = input => typeof input === 'string' ? input : input.map(t => (t.role === 'user' ? 'Étudiante : ' : 'Buddy : ') + t.content).join('\n\n');
  const f = async (input, o) => { if (o?.images?.length) throw {code:'images_unavailable'}; let text; try { text = await complete(flat(input)); } catch(e){ throw {code:'upstream_error', message:String(e)}; } o?.onText?.({text, delta:text}); return {text, truncated:false}; };
  f.json = async (input, o) => { const {text} = await f(input + '\n\nRéponds uniquement avec le JSON demandé, sans texte autour.', o); const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); const body = m ? m[1] : text.slice(text.search(/[\[{]/), Math.max(text.lastIndexOf('}'), text.lastIndexOf(']')) + 1); try { return JSON.parse(body); } catch(e){ throw {code:'invalid_json', text}; } };
  return f;
}

const ERR = {not_granted:'Tu as refusé l’accès à Claude. Recharge la page pour qu’il te le redemande.', rate_limited:'Ta limite Claude est atteinte pour le moment. Réessaie plus tard.', prompt_too_large:'Ce cours est trop long pour une seule demande : choisis une partie ou retire un fichier.', invalid_json:'La réponse de Claude n’était pas lisible. Réessaie.', sampling_disabled:'Claude n’est pas disponible pour ce compte.', capability_disabled:'Claude n’est pas disponible pour ce compte.', session_expired:'Ta session Claude a expiré. Recharge la page.', refused:'Claude a refusé cette demande. Essaie une autre partie du cours.', empty_completion:'Claude n’a rien renvoyé. Réessaie.', images_unavailable:'Claude ne peut pas lire d’image ici.'};
const errText = e => ERR[e?.code] || ('Claude n’a pas répondu (' + (e?.code || 'erreur') + '). Réessaie.');

/* ================= the engine: rules and templates ================= */
const ENGINE = `Tu es le moteur d’exercices Buddy. Tu fabriques un jeu d’entraînement pour une étudiante, à partir de SON cours uniquement (cours, diapos, annales, notes, projets).
Règles d’apprentissage :
- Elle répond avant de voir la réponse. Une seule idée par carte. Questions courtes (20 mots max).
- Mélange les notions. Préfère une situation concrète et nouvelle à une phrase recopiée.
- Pièges plausibles : les vraies confusions, jamais de réponse absurde. "why" et "trap" : une phrase chacun.
- Si le cours contient des annales [Annale], imite leur style de questions.
Tu choisis UNIQUEMENT parmi ces modèles ("type") et tu remplis leurs champs :
- "pick" : situation?, ask, options[4], answer (une des options).
- "case" : situation (2 phrases), steps[2-3] = {ask, options[3-4], answer}.
- "sort" : ask, buckets[2-4], items[4-6] = {text, bucket}.
- "order" : ask, items[3-6] dans le bon ordre (seulement si le cours donne un ordre).
- "build" : ask, items[3-4] blocs courts dans l’ordre, traps[2] blocs pièges plausibles.
- "flash" : front (le terme), back (définition + un exemple).
- "mistake" : ask, lines[3-6] (une copie d’étudiant), answer = index (0..) de la seule ligne fausse.
- "number" : situation, ask, numbers {nom: valeur}, formula (arithmétique sur les noms), answer (nombre), unit, steps[] (le calcul étape par étape).
- "speed" : ask, pairs[4-6] = [terme, définition courte].
- "explain" : ask, model (réponse attendue), keys[2-4] (les idées que la réponse doit contenir).
Preuve : chaque carte a "quote" (une phrase du cours recopiée MOT POUR MOT, 30 mots max) et "page" (le numéro du marqueur [type · fichier · p. N]). N’invente rien qui ne soit pas dans le cours.`;
const FORMAT_MIX = {QCM:'surtout "pick" et "case" avec des pièges très proches', Dissertation:'des "build" et "explain" (arguments, définitions d’intro), des "pick" sur les distinctions, un "order" si possible', 'Cas pratique':'surtout "case" et "pick" concrets, un "explain" pour justifier', 'Juste comprendre':'"flash", "sort" et "pick" simples puis plus durs'};
const TYPE_MIX = {Mélange:null, Situations:'uniquement "pick" et "case"', Flashcards:'uniquement "flash"', Trier:'uniquement "sort"', Ordre:'uniquement "order"', Construire:'uniquement "build"', Rédiger:'uniquement "explain"', Calculs:'uniquement "number" et "mistake" sur les calculs du cours', 'Speed round':'un seul "speed" puis des "flash"'};

function okNumber(k){ try { const toks = String(k.formula).match(/\d+(?:\.\d+)?|[A-Za-z_]\w*|[-+*/()]/g) || []; let i = 0; const nums = k.numbers || {};
  const prim = () => { const t = toks[i++]; if (t === '(') { const v = expr(); i++; return v; } if (t === '-') return -prim(); if (/^\d/.test(t)) return +t; if (t in nums) return +nums[t]; throw 0; };
  const term = () => { let v = prim(); while (toks[i] === '*' || toks[i] === '/') { const o = toks[i++]; const r = prim(); v = o === '*' ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while (toks[i] === '+' || toks[i] === '-') { const o = toks[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; };
  const v = expr(); return Math.abs(v - +k.answer) <= Math.max(.01, Math.abs(+k.answer) * .01); } catch(e){ return false; } }
function checkCards(c, all){
  const hay = c.files.flatMap(f => (f.pages || []).map(pg => ({p:pg.p, f:f.name, t:norm(pg.text)})));
  const out = [];
  for (const k of all) {
    if (!k || !k.type || !k.quote) continue;
    const q = norm(k.quote).replace(/^["']|["']$/g,'').replace(/[.…]+$/,''); const hit = q.length > 12 && hay.find(h => h.t.includes(q)); if (!hit) continue;
    const base = {...k, page: hit.p, file: hit.f, id: uid()};
    const t = k.type; let ok = false;
    if (t === 'pick') ok = Array.isArray(k.options) && k.options.length === 4 && k.options.includes(k.answer) && k.ask;
    if (t === 'case') { if (Array.isArray(k.steps) && k.situation) k.steps.forEach((s, i) => { if (s && Array.isArray(s.options) && s.options.includes(s.answer) && s.ask) out.push({...base, id: uid(), type:'pick', caseStep: (i + 1) + '/' + k.steps.length, situation: k.situation, ask: s.ask, options: s.options, answer: s.answer}); }); continue; }
    if (t === 'sort') ok = Array.isArray(k.buckets) && k.buckets.length >= 2 && Array.isArray(k.items) && k.items.length >= 3 && k.items.every(x => x && k.buckets.includes(x.bucket));
    if (t === 'order') ok = Array.isArray(k.items) && k.items.length >= 3 && k.items.length <= 6;
    if (t === 'build') ok = Array.isArray(k.items) && k.items.length >= 2 && Array.isArray(k.traps) && k.traps.length >= 1;
    if (t === 'flash') ok = k.front && k.back;
    if (t === 'mistake') ok = Array.isArray(k.lines) && Number.isInteger(+k.answer) && +k.answer >= 0 && +k.answer < k.lines.length;
    if (t === 'number') ok = okNumber(k);
    if (t === 'speed') ok = Array.isArray(k.pairs) && k.pairs.length >= 3 && k.pairs.every(p => Array.isArray(p) && p.length === 2);
    if (t === 'explain') ok = k.ask && k.model && Array.isArray(k.keys) && k.keys.length >= 1;
    if (ok) out.push(base);
  }
  return out;
}
async function makeGame(opts){
  const c = course(); if (!sample || busy) return;
  const readable = c.files.filter(f => f.pages && f.pages.length); if (!readable.length) { sheet = 'files'; render(); return toast('Ajoute d’abord ton cours.'); }
  const minutes = opts.minutes || 5, n = minutes >= 15 ? 10 : minutes >= 10 ? 8 : 5, days = daysTo(c);
  let focus = opts.on === 'part' ? (opts.part || '') : '';
  const reviewPart = opts.on === 'mistakes' && c.review.length ? '\n- Fais UNIQUEMENT des cartes sur ces idées ratées, autrement : ' + c.review.slice(0, 8).map(k => k.ask || k.front).join(' / ') : (c.review.length ? '\n- Elle a déjà raté : ' + c.review.slice(0, 4).map(k => k.ask || k.front).join(' / ') + '. Reprends-en une autrement.' : '');
  const mix = TYPE_MIX[opts.kind] || FORMAT_MIX[c.exam.format] || 'un mélange des modèles adaptés au cours';
  const prompt = `${ENGINE}

L’étudiante :
- Son partiel : ${fmt(c)}${days !== null && days >= 0 ? ', dans ' + plural(days, 'jour') : ''}.
- Ce jeu : ${mix}. ${minutes} minutes, donc ${n} cartes.${focus ? '\n- Uniquement sur : ' + focus + '.' : ''}${reviewPart}

Réponds uniquement avec ce JSON : {"title":"titre court du jeu","cards":[ ... ]}

LE COURS :
${textOf(c).slice(0, 180000)}`;
  busy = true; sheet = null; making = {step:0, n, written:0}; view = {name:'making', id:c.id}; render();
  const t1 = setTimeout(() => { if (making && making.step === 0) { making.step = 1; drawMaking(); } }, 2500);
  try {
    const out = await sample.json(prompt, {modelTier:'default', onText: ({text}) => { if (!making) return; making.step = Math.max(making.step, 1); making.written = Math.min(n, (text.match(/"type"\s*:/g) || []).length); drawMaking(); }});
    clearTimeout(t1); claudeState = 'ok';
    const all = Array.isArray(out?.cards) ? out.cards : [];
    making.step = 2; making.written = all.length; drawMaking();
    const kept = checkCards(c, all);
    await new Promise(r => setTimeout(r, 700));
    busy = false; making = null;
    if (!kept.length) { view = {name:'course', id:c.id}; render(); return toast('Aucune carte n’a passé la vérification des citations. Réessaie.'); }
    const g = {id: uid(), title: String(out.title || opts.kind || 'Jeu'), cards: kept, best: null, created: Date.now(), kind: opts.kind || 'Mélange'};
    c.games.unshift(g); save();
    startGame(c, g, all.length - kept.length);
  } catch(e){ clearTimeout(t1); busy = false; making = null; if (e?.code === 'not_granted') claudeState = 'refused'; view = {name:'course', id:c.id}; render(); toast(errText(e)); }
}
async function ask(text){
  const c = course(); if (!sample || busy || !text.trim()) return;
  const turns = chats[c.id] = chats[c.id] || [];
  turns.push({role:'user', content:text.trim()}); turns.push({role:'assistant', content:''});
  busy = true; drawSheet();
  const rules = `Tu es Buddy, le compagnon de révision d’une étudiante. Réponds en français, en 2 à 4 phrases courtes, uniquement d’après son cours ci-dessous, et cite la page (p. N). Si le cours n’en parle pas, dis-le simplement. Pour un résumé ou un plan, des puces courtes.\n\nLE COURS :\n${textOf(c).slice(0, 180000)}`;
  try {
    const {text: t} = await sample([{role:'user', content: rules}, ...turns.slice(0, -1).slice(-8)], {cache:false, modelTier:'default', onText: ({text}) => { turns[turns.length-1].content = text; const el = document.getElementById('lastai'); if (el) el.textContent = text; }});
    turns[turns.length-1].content = t; claudeState = 'ok';
  } catch(e){ turns[turns.length-1].content = errText(e); if (e?.code === 'not_granted') claudeState = 'refused'; }
  busy = false; drawSheet(); document.getElementById('lastai')?.scrollIntoView({block:'nearest'});
}

let pdfReady = null;
function pdfLib(){ if (pdfReady) return pdfReady; pdfReady = (async () => { const L = window.pdfjsLib; if (!L) throw new Error('pdf'); try { const blob = new Blob(["importScripts('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');"], {type:'text/javascript'}); L.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(blob)); } catch(e){ L.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } return L; })(); return pdfReady; }
const KIND = name => /annale|partiel|examen|exam|sujet/i.test(name) ? 'Annale' : /projet|project|dossier|rapport/i.test(name) ? 'Projet' : /note|brouillon/i.test(name) ? 'Notes' : /diapo|slide|\.pptx?$/i.test(name) ? 'Diapos' : /lecture|reading|article/i.test(name) ? 'Lecture' : 'Cours';
const xmlText = (xml, tag) => { const d = new DOMParser().parseFromString(xml, 'application/xml'); return [...d.getElementsByTagName(tag)].map(n => n.textContent).join(' '); };
async function ocr(blobs, label){
  if (!sample || !canImages) throw {plain:'Pour lire ' + label + ', Buddy a besoin de Claude avec les images : ouvre Buddy dans Claude.'};
  const pages = [];
  for (let i = 0; i < blobs.length; i++) {
    reading.detail = 'Claude lit ' + label + ' · ' + (i + 1) + '/' + blobs.length; drawSheet();
    const {text} = await sample('Recopie fidèlement tout le texte de cette image (notes de cours, copie, diapo), dans l’ordre, sans rien ajouter. Si rien n’est lisible, réponds seulement : ILLISIBLE', {images:[blobs[i]], modelTier:'quick', cache:false});
    if (text && !/^\s*ILLISIBLE/.test(text)) pages.push({p:i + 1, text:text.trim()});
  }
  return pages;
}
async function readFile(f){
  const n = f.name.toLowerCase();
  if (/\.(pages|key|numbers|odt|odp|ods|doc|ppt|xls|xlsx|rtf|zip|mp4|mov|mp3|m4a|heic)$/.test(n)) {
    const ext = n.split('.').pop();
    throw {plain: ext === 'heic' ? 'Format HEIC illisible ici : prends la photo en JPG, ou exporte-la, puis réessaie.' : 'Format .' + ext + ' illisible : exporte-le en PDF, puis réessaie.'};
  }
  if (/\.pdf$/.test(n) || f.type === 'application/pdf') {
    const L = await pdfLib(); const doc = await L.getDocument({data: await f.arrayBuffer()}).promise; const pages = [];
    for (let i = 1; i <= doc.numPages; i++) { reading.detail = 'page ' + i + '/' + doc.numPages; drawSheet(); const pg = await doc.getPage(i); const tc = await pg.getTextContent(); pages.push({p:i, text: tc.items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g,' ').trim()}); }
    const withText = pages.filter(p => p.text.length > 30);
    if (withText.length >= Math.max(1, doc.numPages * .3)) return {pages: withText, unit:'page', how: plural(withText.length, 'page') + ' lue' + (withText.length > 1 ? 's' : '')};
    const shots = [];
    for (let i = 1; i <= Math.min(doc.numPages, 12); i++) { const pg = await doc.getPage(i); const vp = pg.getViewport({scale: 1.6}); const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; await pg.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise; shots.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', .85))); }
    const got = await ocr(shots, 'ton scan');
    if (!got.length) throw {plain:'Scan illisible : la page est trop floue. Reprends-la plus nette, ou envoie le PDF d’origine.'};
    return {pages: got, unit:'page', how:'scan lu par Claude · ' + plural(got.length, 'page') + (doc.numPages > 12 ? ' (les 12 premières)' : '')};
  }
  if (/\.pptx$/.test(n)) {
    const zip = await JSZip.loadAsync(await f.arrayBuffer());
    const slides = Object.keys(zip.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
    const pages = []; for (let i = 0; i < slides.length; i++) { const t = xmlText(await zip.file(slides[i]).async('string'), 'a:t').replace(/\s+/g, ' ').trim(); if (t) pages.push({p:i + 1, text:t}); }
    if (!pages.length) throw {plain:'Ces diapos n’ont pas de texte (que des images). Exporte-les en PDF, puis réessaie.'};
    return {pages, unit:'diapo', how: plural(pages.length, 'diapo') + ' lue' + (pages.length > 1 ? 's' : '')};
  }
  if (/\.docx$/.test(n)) {
    const zip = await JSZip.loadAsync(await f.arrayBuffer()); const xml = await zip.file('word/document.xml')?.async('string'); if (!xml) throw {plain:'Ce fichier Word est abîmé. Exporte-le en PDF, puis réessaie.'};
    const d = new DOMParser().parseFromString(xml, 'application/xml'); const paras = [...d.getElementsByTagName('w:p')].map(p => [...p.getElementsByTagName('w:t')].map(t => t.textContent).join('')).filter(Boolean);
    const pages = []; let buf = '', p = 1; for (const para of paras) { if ((buf + para).length > 2500 && buf) { pages.push({p: p++, text: buf.trim()}); buf = ''; } buf += para + '\n'; } if (buf.trim()) pages.push({p, text: buf.trim()});
    if (!pages.length) throw {plain:'Ce fichier Word est vide.'};
    return {pages, unit:'page', how: plural(pages.length, 'partie') + ' lue' + (pages.length > 1 ? 's' : '')};
  }
  if (/\.(png|jpe?g|webp|gif)$/.test(n) || /^image\//.test(f.type)) {
    const got = await ocr([f], 'ta photo'); if (!got.length) throw {plain:'Photo illisible : reprends-la plus nette, bien à plat.'};
    return {pages: got, unit:'page', how:'photo lue par Claude'};
  }
  if (/\.(txt|md|csv)$/.test(n) || /^text\//.test(f.type)) {
    const t = await f.text(); const pages = t.split(/\f|\n{3,}/).map((x, i) => ({p:i + 1, text:x.trim()})).filter(p => p.text);
    if (!pages.length) throw {plain:'Ce fichier est vide.'};
    return {pages, unit:'page', how: plural(pages.length, 'partie') + ' lue' + (pages.length > 1 ? 's' : '')};
  }
  throw {plain:'Format illisible : exporte-le en PDF, puis réessaie.'};
}
document.getElementById('file').addEventListener('change', async e => {
  const list = [...e.target.files]; e.target.value = ''; const c = course(); if (!list.length || !c) return;

/* ================= game engine ================= */
function prep(k){
  const st = {done:false, ok:null};
  if (k.type === 'pick') st.opts = shuffle(k.options);
  if (k.type === 'order') { st.pool = shuffle(k.items); st.placed = []; }
  if (k.type === 'build') { st.pool = shuffle(k.items.concat(k.traps)); st.placed = []; }
  if (k.type === 'sort') { st.items = shuffle(k.items); st.i = 0; st.res = []; }
  if (k.type === 'speed') { st.left = shuffle(k.pairs.map(p => p[0])); st.right = shuffle(k.pairs.map(p => p[1])); st.gone = []; st.time = 25; st.started = false; st.errors = 0; }
  if (k.type === 'flash') st.flipped = false;
  return st;
}
function startGame(c, g, dropped){
  const cards = g.review ? g.cards : g.cards;
  game = {courseId:c.id, gameId:g.id, title:g.title, review: !!g.review, daily: !!g.daily, cards, queue: cards.map(k => k.id), byId: Object.fromEntries(cards.map(k => [k.id, k])), retried:{}, first:{}, i:0, dropped: dropped || 0, t0: Date.now()};
  game.cur = game.queue.shift(); game.st = prep(game.byId[game.cur]);
  view = {name:'play', id:c.id}; render(); window.scrollTo(0,0);
}
let speedTimer = null;
function finish(ok){
  const g = game, k = g.byId[g.cur], st = g.st, c = S.courses.find(x => x.id === g.courseId);
  st.done = true; st.ok = ok; clearInterval(speedTimer);
  if (!(g.cur in g.first)) g.first[g.cur] = ok;
  const keyOf = x => x.ask || x.front || x.title;
  if (!ok && !g.retried[g.cur] && k.type !== 'flash') { g.retried[g.cur] = true; g.queue.push(g.cur); }
  if (!ok && !c.review.some(r => keyOf(r) === keyOf(k))) c.review.push(k);
  if (ok && g.review) c.review = c.review.filter(r => keyOf(r) !== keyOf(k));
  save();
  if (k.type === 'flash') return next();
  render();
}
function next(){ const g = game; g.i++; g.cur = g.queue.shift(); if (g.cur) g.st = prep(g.byId[g.cur]); else g.t1 = Date.now(); render(); window.scrollTo(0,0); }

/* Partie du jour: a random mix of the games she already has, misses first. Free and instant. Claude writes only the very first game. */
function daily(c){
  const pool = c.games.flatMap(g => g.cards);
  if (!pool.length) return makeGame({on:'all', kind:'Mélange', minutes:5});
  const keyOf = x => x.ask || x.front || x.title, seen = new Set(), pick = [];
  for (const k of shuffle(c.review).concat(shuffle(pool))) { const id = keyOf(k); if (seen.has(id)) continue; seen.add(id); pick.push({...k, id: uid()}); if (pick.length >= 5) break; }
  startGame(c, {id:'daily', daily:true, title:'Partie du jour', cards: pick}, 0);
}

function welcome(){

    <button class="btn" data-a="create">Créer le jeu</button><p class="tiny muted" style="text-align:center">Le format de ton partiel (${esc(fmt(c))}) est pris en compte.</p>`; }
  if (sheet === 'gmenu') { const g = c.games.find(x => x.id === gmenu); if (!g) return '';
    return `<h2 style="font-size:24px">${esc(g.title)}</h2><button class="btn ink" data-a="play" data-v="${g.id}">Rejouer</button>${view.renaming ? `<form id="renameform" class="row" style="flex-wrap:nowrap"><input id="gname" value="${esc(g.title)}" aria-label="Nom du jeu" style="flex:1"><button class="btn sm" type="submit">OK</button></form>` : '<button class="btn white" data-a="grename">Renommer</button>'}<button class="btn white" data-a="gdelete" style="color:#b4500a">${view.confirmG ? 'Toucher encore pour supprimer' : 'Supprimer ce jeu'}</button><p class="tiny muted" style="text-align:center">Supprimer ne touche pas à ton cours ni à tes erreurs à revoir.</p>`; }
  if (sheet === 'ask') { const turns = chats[c.id] || [];
    return `<h2 style="font-size:26px">Pose une question</h2><div class="msgs">${turns.length ? turns.map((t, i) => `<div class="msg ${t.role === 'user' ? 'me' : 'ai'}" ${i === turns.length - 1 && t.role !== 'user' ? 'id="lastai"' : ''}>${esc(t.content || '…')}</div>`).join('') : `<p class="muted">Claude répond seulement d’après ton cours, avec la page.</p><div class="chips">${['Résume-moi le cours','Donne-moi un plan de dissert','C’est quoi la notion clé ?'].map(q => `<button class="chip" data-a="askchip" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}</div>
    <form id="askform" class="row" style="flex-wrap:nowrap"><input id="q" placeholder="Ta question sur le cours" autocomplete="off" style="flex:1;min-width:0;border-radius:99px"><button class="btn ink sm" type="submit" aria-label="Envoyer" ${busy ? 'disabled' : ''}>${busy ? '<span class="nod" aria-hidden="true" style="margin:0"><span>d</span><span>d</span></span>' : '↑'}</button></form>`; }
  return '';
}
function drawSheet(){
  const host = document.getElementById('sheet');
  if (view.name === 'setup') { document.getElementById('app').innerHTML = setupScreen(); bindInputs(); }
  if (!sheet) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="scrim" data-a="close"><div class="sheet" data-stop role="dialog" aria-modal="true"><span class="grab"></span>${sheetHtml()}</div></div>`;
  bindInputs();
}
function bindInputs(){
  const af = document.getElementById('askform'); if (af) af.onsubmit = e => { e.preventDefault(); const q = document.getElementById('q'); const v = q.value; q.value = ''; ask(v); };
  const nf = document.getElementById('newform'); if (nf) { nf.querySelector('input').focus(); nf.onsubmit = e => { e.preventDefault(); const n = document.getElementById('cname').value.trim(); if (!n) return; const c = newCourse(n); S.courses.push(c); S.welcomed = true; save(); view = {name:'setup', id:c.id}; render(); }; }
  const eo = document.getElementById('exother'); if (eo) eo.oninput = () => { course().exam.other = eo.value; save(); };
  const ed = document.getElementById('exdate'); if (ed) ed.onchange = () => { course().exam.date = ed.value; save(); };
  const np = document.getElementById('ngpart'); if (np) np.oninput = () => { newGame.part = np.value; };
  const rf = document.getElementById('renameform'); if (rf) rf.onsubmit = e => { e.preventDefault(); const g = course().games.find(x => x.id === gmenu); const v = document.getElementById('gname').value.trim(); if (g && v) { g.title = v; save(); } view.renaming = false; render(); };
  const num = document.getElementById('num'); if (num) num.oninput = () => { game.st.val = num.value; };
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = view.name === 'welcome' ? welcome() : view.name === 'new' ? newCourseScreen() : view.name === 'setup' ? setupScreen() : view.name === 'course' ? courseScreen() : view.name === 'making' ? makingScreen() : view.name === 'play' ? play() : home();
  drawSheet(); bindInputs();
}

/* ================= actions ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  if (t.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  const a = t.dataset.a, v = t.dataset.v, c = course(), g = game, st = g?.st, k = g ? g.byId[g.cur] : null;
  switch (a) {
    case 'close': sheet = null; view.confirmReset = view.confirmDelete = view.confirmG = view.renaming = false; return render();
    case 'sheet': sheet = v; return drawSheet();
    case 'try': S.welcomed = true; save(); view = {name:'course', id:'ex'}; return render();
    case 'reset': if (!view.confirmReset) { view.confirmReset = true; return drawSheet(); } S = fresh(); save(); sheet = null; view = {name:'welcome'}; return render();
    case 'home': view = {name:'home'}; return render();
    case 'new': view = {name:'new'}; return render();
    case 'open': S.welcomed = true; save(); view = {name:'course', id:v}; render(); return window.scrollTo(0,0);
    case 'upload': return document.getElementById('file').click();
    case 'rmfile': c.files.splice(+v, 1); save(); return view.name === 'setup' ? render() : drawSheet();
    case 'exam': { const kk = t.dataset.k; c.exam[kk] = v; save(); return view.name === 'setup' ? render() : drawSheet(); }
    case 'go-course': view = {name:'course', id:c.id}; return render();
    case 'rename': { sheet = null; render(); const h = document.querySelector('.main h1'); if (!h) return; h.contentEditable = 'true'; h.focus(); document.getSelection().selectAllChildren(h); h.onblur = () => { const s = h.textContent.trim(); if (s) { c.name = s; save(); } render(); }; h.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); h.blur(); } }; return; }
    case 'rmcourse': if (!view.confirmDelete) { view.confirmDelete = true; return drawSheet(); } S.courses = S.courses.filter(x => x.id !== c.id); save(); sheet = null; view = {name:'home'}; return render();
    case 'daily': return daily(c);
    case 'ng': { const kk = t.dataset.k; newGame[kk] = kk === 'minutes' ? +v : v; return drawSheet(); }
    case 'create': return makeGame({...newGame});
    case 'play': { const gg = c.games.find(x => x.id === v); sheet = null; return startGame(c, gg, 0); }
    case 'gmenu': gmenu = v; sheet = 'gmenu'; view.confirmG = false; view.renaming = false; return drawSheet();
    case 'grename': view.renaming = true; return drawSheet();
    case 'gdelete': if (!view.confirmG) { view.confirmG = true; return drawSheet(); } c.games = c.games.filter(x => x.id !== gmenu); save(); sheet = null; toast('Jeu supprimé.'); return render();
    case 'review': return startGame(c, {id:'review', review:true, title:'À revoir', cards: shuffle(c.review).slice(0, 8).map(x => ({...x, id: uid()}))}, 0);
    case 'askchip': return ask(v);
    case 'sel': if (st.done) return; st.sel = v; return render();
    case 'line': if (st.done) return; st.sel = +v; return render();
    case 'place': st.placed.push(v); return render();
    case 'unplace': if (st.done) return; st.placed.splice(+v, 1); return render();
    case 'hint': st.hint = true; return render();
    case 'flip': st.flipped = !st.flipped; return render();
    case 'flashyes': return finish(true);
    case 'flashno': return finish(false);
    case 'bucket': { const it = st.items[st.i]; st.res.push({text: it.text, ok: it.bucket === v}); st.i++; if (st.i >= st.items.length) return finish(st.res.every(r => r.ok)); return render(); }
    case 'speedgo': st.started = true; speedTimer = setInterval(() => { st.time--; if (st.time <= 0) { st.time = 0; return finish(false); } render(); }, 1000); return render();
    case 'L': st.pickL = v; return render();
    case 'R': { if (!st.pickL) return; const p = k.pairs.find(p => p[0] === st.pickL); if (p[1] === v) { st.gone.push(st.pickL); if (st.gone.length === k.pairs.length) { st.pickL = null; return finish(true); } } else { st.errors++; toast('Pas cette paire.'); } st.pickL = null; return render(); }
    case 'grade': return gradeExplain();
    case 'check': {
      let ok = false;
      if (k.type === 'pick') ok = st.sel === k.answer;
      if (k.type === 'order' || k.type === 'build') ok = st.placed.every((x, i) => x === k.items[i]) && st.placed.length === k.items.length;
      if (k.type === 'mistake') ok = st.sel === +k.answer;
      if (k.type === 'number') { const val = parseFloat(String(st.val ?? document.getElementById('num')?.value ?? '').replace(',', '.').replace(/\s/g, '')); if (isNaN(val)) return toast('Écris un nombre.'); st.val = val; ok = Math.abs(val - +k.answer) <= Math.max(.01, Math.abs(+k.answer) * .01); }
      return finish(ok);
    }
    case 'next': return next();
    case 'quit': clearInterval(speedTimer); game = null; view = {name:'course', id:view.id}; render(); return window.scrollTo(0,0);
    case 'continue': game = null; view = {name:'course', id:view.id}; render(); return window.scrollTo(0,0);
    case 'replay-now': { if (g.daily) return daily(c); const gg = c.games.find(x => x.id === g.gameId); return gg ? startGame(c, gg, 0) : null; }
  }
});
render();
</script>
